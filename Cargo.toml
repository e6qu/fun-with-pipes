[package]
name = "fwp"
version = "0.1.0"
edition = "2021"
description = "fwp (\"foop\"): a tacit, statically typed, pipe-oriented language"
license = "MIT"

[[bin]]
name = "fwp"
path = "src/main.rs"

[lib]
name = "fwp"
path = "src/lib.rs"

[profile.release]
debug = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
ctrlc = "3.5"
