name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # fwp itself as WebAssembly (tests/browser.rs, the playground)
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebAssembly toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld wasi-libc libclang-rt-18-dev-wasm32
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (WebAssembly build)
        run: cargo clippy --target wasm32-wasip1 -- -D warnings
      - name: test
        run: cargo test --all-targets
