name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Optimize the compiler used by long suites while keeping development checks.
# These workflow settings do not change local Cargo defaults or generated-C flags.
env:
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
  # macOS suppresses allocator error messages when stderr is captured unless
  # reporting is explicit. Preserve the original error in each failed test log.
  MallocDebugReport: stderr
  FWP_KERNEL_BOUNDS_ARTIFACTS: ownership-evidence/kernel-bounds
  FWP_CALLBACK_CAPTURE_ARTIFACTS: ownership-evidence/direct-captures
  FWP_ARRAY_CAPTURE_ARTIFACTS: ownership-evidence/array-captures

jobs:
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/windows.yml
    with:
      full: true

  macos:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: ownership-evidence/arc
      FWP_FILE_APPLICATION_ARTIFACTS: ownership-evidence/file-applications
      FWP_HTTP_APPLICATION_ARTIFACTS: ownership-evidence/http-application
      FWP_MAP_FAILURE_ARTIFACTS: ownership-evidence/maps
      FWP_STATIC_GUARD_ARTIFACTS: ownership-evidence/static-guards
      FWP_TAIL_ARTIFACTS: ownership-evidence/tail
      FWP_AD_WORKSPACE_ARTIFACTS: ownership-evidence/workspaces
      FWP_AD_SCOPE_ARTIFACTS: ownership-evidence/scopes
      FWP_UDP_ARTIFACTS: ownership-evidence/udp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache locked Rust dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Rust dependencies before offline builds
        shell: bash
        env:
          CARGO_NET_RETRY: '5'
          CARGO_HTTP_TIMEOUT: '30'
        run: |
          cargo fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: OpenSSL 3
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Generated standard-library docs preflight
        run: |
          CARGO_MANIFEST_DIR="$PWD" rustc --test tests/stdlib_doc.rs -o "$RUNNER_TEMP/fwp-stdlib-doc-check"
          env -u FWP_BLESS "$RUNNER_TEMP/fwp-stdlib-doc-check" --exact stdlib_doc_is_current
      - name: Exact-head primitive contract inventory
        env:
          FWP_INVENTORY_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ownership-inventory"
          rustc --version > "$RUNNER_TEMP/ownership-inventory/rustc.txt"
          python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output "$RUNNER_TEMP/ownership-inventory/candidate.json" 2>&1 | tee "$RUNNER_TEMP/ownership-inventory/audit.log"
          python3 scripts/inventory-memory-diagnostics.py --source "$FWP_INVENTORY_EXPECTED_HEAD" --output "$RUNNER_TEMP/ownership-inventory/memory-diagnostics.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ownership-inventory-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ownership-inventory/
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Language formatting preflight
        run: cargo run --bin fwp -- fmt --check lib examples docs/tutorials bench
      - name: Regular macOS test shard
        if: ${{ !cancelled() }}
        run: python3 scripts/run-native-tests.py --idle-timeout 1800 --shard regular --logs "$RUNNER_TEMP/macos-regular-tests"
      - name: Publish individual regular test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-regular-tests-${{ matrix.runner }}
          path: ${{ runner.temp }}/macos-regular-tests/
          if-no-files-found: warn
      - name: Inspect array-sort ownership and wide-value controls
        if: ${{ !cancelled() }}
        run: python3 scripts/inspect-array-sort.py --input ownership-evidence/arc/array-sort --source "${{ github.event.pull_request.head.sha || github.sha }}" --system macOS --arch "$RUNNER_ARCH" --objdump "$(xcrun --find llvm-objdump)" --output ownership-evidence/array-sort-inspection.json
      - name: Inspect array construction moves and cleanup
        if: ${{ !cancelled() }}
        run: python3 scripts/inspect-array-construction.py --input ownership-evidence/arc/array-construction --source "${{ github.event.pull_request.head.sha || github.sha }}" --system macOS --arch "$RUNNER_ARCH" --objdump "$(xcrun --find llvm-objdump)" --output ownership-evidence/array-construction-inspection.json
      - name: Build compiler for Python SDK checks
        id: sdk_compiler
        if: ${{ !cancelled() }}
        run: cargo build --locked --bin fwp
      - name: Python SDK and native disassembly
        if: ${{ !cancelled() && steps.sdk_compiler.outcome == 'success' }}
        env:
          PYTHONPATH: sdk/python
          FWP_TEST_BIN: ${{ github.workspace }}/target/debug/fwp
          CC: clang
        run: |
          FWP_OBJDUMP="$(xcrun --find llvm-objdump)"
          export FWP_OBJDUMP
          python3 -W error::ResourceWarning -m unittest discover -s sdk/python/tests -v
      - name: Build standalone compiler
        id: standalone_compiler
        if: ${{ !cancelled() }}
        run: cargo build --release --bin fwp
      - name: Iterator and state allocation and binary evidence
        if: ${{ !cancelled() && steps.standalone_compiler.outcome == 'success' }}
        run: |
          python3 scripts/measure-iteration.py --output "$RUNNER_TEMP/iteration-evidence"
          python3 scripts/measure-checkpoint.py --output "$RUNNER_TEMP/iteration-evidence/checkpoint"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iteration-evidence-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/iteration-evidence/
      - name: Verify separate native artifact outside checkout
        id: native_package
        if: ${{ !cancelled() && steps.standalone_compiler.outcome == 'success' }}
        run: python3 scripts/package-native.py --output "$RUNNER_TEMP/native-package"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.native_package.outcome == 'success' }}
        with:
          name: fwp-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/native-package/
          if-no-files-found: error
      - name: Preserve failed native golden binaries and C
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/golden-failures"
          find "${TMPDIR:-/tmp}" -maxdepth 1 -type f -name 'fwp-golden-*' -exec cp {} "$RUNNER_TEMP/golden-failures/" ";"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-failures-${{ matrix.runner }}
          path: ${{ runner.temp }}/golden-failures/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ownership-evidence-regular-${{ runner.os }}-${{ runner.arch }}
          path: ownership-evidence/

      - name: Preserve compiler crash reports
        uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'macOS'
        with:
          name: compiler-crashes-regular-${{ matrix.runner }}
          path: |
            ~/Library/Logs/DiagnosticReports/fwp*
            target/debug/fwp
          if-no-files-found: ignore

  # Split the integration targets between the two existing macOS jobs.
  # Both shards exclude the full golden corpus; this job runs it separately once.
  # Their union retains the full suite; slow runners must finish every target.
  macos_ownership:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: ownership-evidence/arc
      FWP_FILE_APPLICATION_ARTIFACTS: ownership-evidence/file-applications
      FWP_HTTP_APPLICATION_ARTIFACTS: ownership-evidence/http-application
      FWP_STATIC_GUARD_ARTIFACTS: ownership-evidence/static-guards
      FWP_TAIL_ARTIFACTS: ownership-evidence/tail
      FWP_AD_WORKSPACE_ARTIFACTS: ownership-evidence/workspaces
      FWP_AD_SCOPE_ARTIFACTS: ownership-evidence/scopes
      FWP_UDP_ARTIFACTS: ownership-evidence/udp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache locked Rust dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Rust dependencies before offline builds
        shell: bash
        env:
          CARGO_NET_RETRY: '5'
          CARGO_HTTP_TIMEOUT: '30'
        run: |
          cargo fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: OpenSSL 3
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Generated standard-library docs preflight
        run: |
          CARGO_MANIFEST_DIR="$PWD" rustc --test tests/stdlib_doc.rs -o "$RUNNER_TEMP/fwp-stdlib-doc-check"
          env -u FWP_BLESS "$RUNNER_TEMP/fwp-stdlib-doc-check" --exact stdlib_doc_is_current
      - name: Language formatting preflight
        run: cargo run --bin fwp -- fmt --check lib examples docs/tutorials bench
      - name: Full counted-ownership golden corpus
        run: |
          set -o pipefail
          cargo test --test native_memory golden_programs_with_counted_ownership -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/native-corpus.log"
      - name: Publish native-memory diagnostics before the remaining shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-corpus-log-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-corpus.log
      - name: Second macOS test shard
        if: ${{ !cancelled() }}
        run: python3 scripts/run-native-tests.py --idle-timeout 1800 --shard ownership --logs "$RUNNER_TEMP/macos-ownership-tests"
      - name: Inspect list-copy executables and missing-cleanup controls
        if: ${{ !cancelled() }}
        run: python3 scripts/inspect-list-copy.py --input ownership-evidence/arc/list-copy --source "${{ github.event.pull_request.head.sha || github.sha }}" --system macOS --arch "$RUNNER_ARCH" --objdump "$(xcrun --find llvm-objdump)" --output ownership-evidence/list-copy-inspection.json
      - name: Publish individual ownership test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-ownership-tests-${{ matrix.runner }}
          path: ${{ runner.temp }}/macos-ownership-tests/
          if-no-files-found: warn
      - name: Preserve failed native corpus binaries, C and statuses
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/native-golden-failures"
          find "${TMPDIR:-/tmp}" -maxdepth 1 -type f -name 'fwp-golden-*' -exec cp {} "$RUNNER_TEMP/native-golden-failures/" ";"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-golden-failures-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-golden-failures/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ownership-evidence-corpus-${{ runner.os }}-${{ runner.arch }}
          path: ownership-evidence/

      - name: Preserve compiler crash reports
        uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'macOS'
        with:
          name: compiler-crashes-corpus-${{ matrix.runner }}
          path: |
            ~/Library/Logs/DiagnosticReports/fwp*
            target/debug/fwp
          if-no-files-found: ignore

  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      FWP_ARC_ARTIFACTS: ownership-evidence/arc
      FWP_FILE_APPLICATION_ARTIFACTS: ownership-evidence/file-applications
      FWP_HTTP_APPLICATION_ARTIFACTS: ownership-evidence/http-application
      FWP_MAP_FAILURE_ARTIFACTS: ownership-evidence/maps
      FWP_STATIC_GUARD_ARTIFACTS: ownership-evidence/static-guards
      FWP_TASK_CONTEXT_ARTIFACTS: ownership-evidence/task-context
      FWP_TAIL_ARTIFACTS: ownership-evidence/tail
      FWP_AD_WORKSPACE_ARTIFACTS: ownership-evidence/workspaces
      FWP_AD_SCOPE_ARTIFACTS: ownership-evidence/scopes
      FWP_UDP_ARTIFACTS: ownership-evidence/udp
      FWP_QUEUED_FUNCTION_ARTIFACTS: ownership-evidence/queued-functions
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # fwp itself as WebAssembly (tests/browser.rs, the playground)
          targets: wasm32-wasip1
      - name: Cache locked Rust dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Rust dependencies before offline builds
        shell: bash
        env:
          CARGO_NET_RETRY: '5'
          CARGO_HTTP_TIMEOUT: '30'
        run: |
          cargo fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: WebAssembly toolchain, OpenSSL headers (TLS)
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld wabt wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32 libssl-dev openssl
      - name: aarch64 cross compiler and qemu (tests/cross.rs)
        if: runner.arch == 'X64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user musl-tools
      - name: binaryen's wasm-opt (`--wasm-async=asyncify`; tests skip without it)
        run: npm install -g binaryen
      - name: Generated standard-library docs preflight
        run: |
          CARGO_MANIFEST_DIR="$PWD" rustc --test tests/stdlib_doc.rs -o "$RUNNER_TEMP/fwp-stdlib-doc-check"
          env -u FWP_BLESS "$RUNNER_TEMP/fwp-stdlib-doc-check" --exact stdlib_doc_is_current
      - name: Exact-head primitive contract inventory
        env:
          FWP_INVENTORY_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ownership-inventory"
          rustc --version > "$RUNNER_TEMP/ownership-inventory/rustc.txt"
          python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output "$RUNNER_TEMP/ownership-inventory/candidate.json" 2>&1 | tee "$RUNNER_TEMP/ownership-inventory/audit.log"
          python3 scripts/inventory-memory-diagnostics.py --source "$FWP_INVENTORY_EXPECTED_HEAD" --output "$RUNNER_TEMP/ownership-inventory/memory-diagnostics.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ownership-inventory-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ownership-inventory/
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (WebAssembly build)
        run: cargo clippy --target wasm32-wasip1 -- -D warnings
      - name: Language formatting preflight
        run: cargo run --bin fwp -- fmt --check lib examples docs/tutorials bench
      - name: test
        if: ${{ !cancelled() }}
        env:
          FWP_REQUIRE_WASM_RESOURCE_COUNTS: "1"
          FWP_REQUIRE_WASI_COUNTS: "1"
          FWP_REQUIRE_WASI_ARC: "1"
          FWP_REQUIRE_WASI_GOLDENS: "1"
          FWP_REQUIRE_FLOAT_WASI: "1"
        run: python3 scripts/run-native-tests.py --idle-timeout 1800 --all --logs "$RUNNER_TEMP/linux-tests"
      - name: Inspect list-copy executables and missing-cleanup controls
        if: ${{ !cancelled() }}
        run: python3 scripts/inspect-list-copy.py --input ownership-evidence/arc/list-copy --source "${{ github.event.pull_request.head.sha || github.sha }}" --system Linux --arch "$RUNNER_ARCH" --objdump objdump --output ownership-evidence/list-copy-inspection.json
      - name: Inspect array-sort ownership and wide-value controls
        if: ${{ !cancelled() }}
        run: python3 scripts/inspect-array-sort.py --input ownership-evidence/arc/array-sort --source "${{ github.event.pull_request.head.sha || github.sha }}" --system Linux --arch "$RUNNER_ARCH" --objdump objdump --output ownership-evidence/array-sort-inspection.json
      - name: Inspect array construction moves and cleanup
        if: ${{ !cancelled() }}
        run: python3 scripts/inspect-array-construction.py --input ownership-evidence/arc/array-construction --source "${{ github.event.pull_request.head.sha || github.sha }}" --system Linux --arch "$RUNNER_ARCH" --objdump objdump --output ownership-evidence/array-construction-inspection.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-test-logs-${{ matrix.runner }}
          path: ${{ runner.temp }}/linux-tests/
          if-no-files-found: ignore
      - name: Build compiler for Python SDK checks
        id: sdk_compiler
        if: ${{ !cancelled() }}
        run: cargo build --locked --bin fwp
      - name: Python SDK and native disassembly
        if: ${{ !cancelled() && steps.sdk_compiler.outcome == 'success' }}
        env:
          PYTHONPATH: sdk/python
          FWP_TEST_BIN: ${{ github.workspace }}/target/debug/fwp
          CC: cc
          FWP_OBJDUMP: llvm-objdump
        run: python3 -W error::ResourceWarning -m unittest discover -s sdk/python/tests -v
      - name: Build standalone compiler
        id: standalone_compiler
        if: ${{ !cancelled() }}
        run: cargo build --release --bin fwp
      - name: Numerical output and lifetime controls
        if: ${{ !cancelled() && steps.standalone_compiler.outcome == 'success' }}
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) output_arch=x86-64 ;;
            ARM64) output_arch=armv8-a ;;
            *) echo "Unsupported numerical control architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          python3 scripts/test-descent-output.py --compiler target/release/fwp \
            --cc gcc --rustc rustc --c-arch "$output_arch" --objdump objdump --nm nm \
            --output "$RUNNER_TEMP/descent-output-controls"
          python3 scripts/test-coordinate-work.py --cc gcc --rustc rustc \
            --c-arch "$output_arch" --output "$RUNNER_TEMP/coordinate-controls.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-output-controls-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/descent-output-controls/
            ${{ runner.temp }}/coordinate-controls.json
          if-no-files-found: warn
      - name: Iterator and state allocation and binary evidence
        if: ${{ !cancelled() && steps.standalone_compiler.outcome == 'success' }}
        run: |
          python3 scripts/measure-iteration.py --output "$RUNNER_TEMP/iteration-evidence"
          python3 scripts/measure-checkpoint.py --output "$RUNNER_TEMP/iteration-evidence/checkpoint"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iteration-evidence-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/iteration-evidence/
      - name: Verify separate native artifact outside checkout
        id: native_package
        if: ${{ !cancelled() && steps.standalone_compiler.outcome == 'success' }}
        run: python3 scripts/package-native.py --output "$RUNNER_TEMP/native-package"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.native_package.outcome == 'success' }}
        with:
          name: fwp-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/native-package/
          if-no-files-found: error
      - name: Preserve failed native golden binaries and C
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/golden-failures"
          find "${TMPDIR:-/tmp}" -maxdepth 1 -type f -name 'fwp-golden-*' -exec cp {} "$RUNNER_TEMP/golden-failures/" ";"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-failures-${{ matrix.runner }}
          path: ${{ runner.temp }}/golden-failures/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ownership-evidence-linux-${{ runner.os }}-${{ runner.arch }}
          path: ownership-evidence/

  bench:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache locked Rust dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Rust dependencies before offline builds
        shell: bash
        env:
          CARGO_NET_RETRY: '5'
          CARGO_HTTP_TIMEOUT: '30'
        run: |
          cargo fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: OpenSSL headers (TLS)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev binutils time
      - name: Benchmark build failure and metadata controls
        run: python3 scripts/test-measurement-build.py
      - name: Numerical measurement requirement controls
        run: python3 scripts/test-descent-budgets.py
      - name: Generated standard-library docs preflight
        run: |
          CARGO_MANIFEST_DIR="$PWD" rustc --test tests/stdlib_doc.rs -o "$RUNNER_TEMP/fwp-stdlib-doc-check"
          env -u FWP_BLESS "$RUNNER_TEMP/fwp-stdlib-doc-check" --exact stdlib_doc_is_current
      - name: Language formatting preflight
        run: cargo run --release --bin fwp -- fmt --check lib examples docs/tutorials bench
      - name: Check peer overflow order and allocation failures
        run: |
          python3 scripts/check-benchmark-peers.py --source "${{ github.event.pull_request.head.sha || github.sha }}" --cc gcc --rustc rustc --arch x86_64 --output target/bench-peer-controls
          python3 scripts/inspect-benchmark-peers.py --input target/bench-peer-controls --source "${{ github.event.pull_request.head.sha || github.sha }}" --arch x86_64 --objdump objdump --output target/bench-peer-inspection.json
      - name: benchmarks against C and Rust (docs/benchmarks.md)
        env:
          CC: gcc
          FWP_LTO: '0'
        run: cargo test --release --test bench benchmarks -- --ignored --exact --nocapture
      - name: Inspect measured C, Rust and checked-ARC binaries
        run: python3 scripts/inspect-benchmark-binaries.py --input target/bench-evidence --source "${{ github.event.pull_request.head.sha || github.sha }}" --arch x86_64 --objdump objdump --output target/bench-inspection.json
      - name: Reject incorrect benchmark claims, binaries and missing samples
        run: python3 scripts/test-benchmark-evidence.py --input target/bench-evidence --source "${{ github.event.pull_request.head.sha || github.sha }}" --arch x86_64 --objdump objdump --output target/bench-controls.json
      - name: Measure process memory and separate managed storage
        run: python3 scripts/measure-benchmark-memory.py --input target/bench-evidence --inspection target/bench-inspection.json --source "${{ github.event.pull_request.head.sha || github.sha }}" --cc gcc --time /usr/bin/time --samples 3 --output target/bench-memory
      - name: Inspect managed-storage images and leak controls
        run: python3 scripts/inspect-benchmark-memory.py --input target/bench-memory --benchmarks target/bench-evidence --inspection target/bench-inspection.json --source "${{ github.event.pull_request.head.sha || github.sha }}" --arch x86_64 --objdump objdump --output target/bench-memory-inspection.json
      - name: Measure sort storage, code size and stack frames
        run: |
          python3 scripts/measure-list-sort-storage.py --compiler target/release/fwp --cc gcc --source "${{ github.event.pull_request.head.sha || github.sha }}" --output target/list-sort-storage
          python3 scripts/inspect-list-sort-storage.py --input target/list-sort-storage --source "${{ github.event.pull_request.head.sha || github.sha }}" --arch X64 --objdump objdump --output target/list-sort-inspection.json
          FWP_STACK=0 FWP_ARRAY_FUSION=0 FWP_PACKED_ARRAYS=1 target/release/fwp build --memory dynamic -O2 --emit-c tests/fixtures/array_sort_reuse.fwp -o target/array-sort-wide.c
          python3 scripts/measure-array-sort-layout.py measure --program target/array-sort-wide.c --cc gcc --directory target/array-sort-layout --source "${{ github.event.pull_request.head.sha || github.sha }}" --system Linux --arch "X64" --objdump objdump --output target/array-sort-layout-inspection.json
      - name: Preserve benchmark comparisons and measured executables
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            target/bench.md
            target/bench-inspection.json
            target/bench-controls.json
            target/bench-peer-controls/
            target/bench-peer-inspection.json
            target/bench-memory/
            target/bench-memory-inspection.json
            target/bench-evidence/
            target/list-sort-storage/
            target/list-sort-inspection.json
            target/array-sort-wide.c
            target/array-sort-layout/
            target/array-sort-layout-inspection.json
          if-no-files-found: error
