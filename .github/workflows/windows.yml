name: Native Windows acceptance
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        required: true
# Optimize the compiler used by long suites while keeping development checks.
# These workflow settings do not change local Cargo defaults or generated-C flags.
env:
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    # Full ownership, golden and standalone-compiler checks share this job.
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_UDP_ARTIFACTS: ownership-evidence/udp
      FWP_TAIL_ARTIFACTS: ownership-evidence/tail
      FWP_CALLBACK_CAPTURE_ARTIFACTS: ownership-evidence/direct-captures
      FWP_ARRAY_CAPTURE_ARTIFACTS: ownership-evidence/array-captures
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache locked Rust dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Rust dependencies before offline builds
        shell: bash
        env:
          CARGO_NET_RETRY: '5'
          CARGO_HTTP_TIMEOUT: '30'
        run: |
          cargo fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Native C toolchain for foreign calls
        shell: pwsh
        id: windows_toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-windows.ps1
      - name: Native Windows compiler check
        id: native_compiler
        shell: pwsh
        run: |
          rustc -vV | Tee-Object windows-host.txt
          cargo check --all-targets 2>&1 | Tee-Object windows-probe.log
          exit $LASTEXITCODE
      - name: Native socket and library execution
        shell: pwsh
        run: |
          cargo test --lib socket_tests -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib dylib::tests -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib softfloat:: -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib sys::tty::tests::native_console -- --exact 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --no-fail-fast --test softfloat_core --test float_math --test scalar_math --test scalar_traps --test integer_output --test static_constants --test tail_recursion --test repl --test debugger --test infix -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --no-fail-fast --test compiler_options --test native_allocator --test windows_context --test native_sockets --test library_unload -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --bin fwp 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python SDK and native disassembly
        env:
          PYTHONPATH: sdk/python
          FWP_TEST_BIN: ${{ github.workspace }}/target/debug/fwp.exe
          FWP_OBJDUMP: llvm-objdump
        run: python -W error::ResourceWarning -m unittest discover -s sdk/python/tests -v
      - name: Language formatting preflight
        shell: pwsh
        run: |
          ./target/debug/fwp.exe fmt --check lib examples docs/tutorials bench
          exit $LASTEXITCODE
      - name: Interpreter golden outputs and exit statuses
        shell: pwsh
        run: |
          cargo test --test golden_run interpreter_snapshots -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          exit $LASTEXITCODE
      - name: Queued function captures, receive ownership and callback effects
        shell: pwsh
        run: |
          cargo test --no-fail-fast --test queued_functions --test channel_queue_ownership --test channel_cycle_ownership --test task_ownership --test task_handle_ownership --test task_timer_order --test within_thunk_ownership --test borrowed_callbacks --test call_effects --test variant_alias_ownership --test variant_conversion_ownership -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          exit $LASTEXITCODE
      - name: Generated programs with native resources and ownership stress
        shell: pwsh
        run: |
          $testTargets = @(
            'cpu_kernel_ownership', 'numerics', 'metrics_ownership', 'ternary_ownership', 'udp_ownership',
            'dns_ownership', 'vector_ownership', 'range_array', 'range_set', 'hash_ownership',
            'mapped_array_construction', 'zip_map_fusion', 'unzip_cleanup', 'list_construction_cleanup', 'list_generation_ownership',
            'list_structure_ownership', 'state_sequence_ownership', 'map_unwind_ownership', 'map_set_ownership', 'collection_construction',
            'cached_map_borrows', 'caf_ownership', 'inline_caf_ownership', 'selection_unwind_ownership', 'zip_unwind_ownership',
            'windows_runtime', 'windows_static_memory', 'loop_unwind_ownership', 'path_validation', 'io_error_ownership',
            'system_snapshots', 'file_values', 'text_file_tools', 'text_transform_ownership', 'file_construction_ownership',
            'file_inline_path', 'file_storage_disposal'
          )
          python scripts/run-native-tests.py --targets $testTargets --idle-timeout 600 --logs windows-resource-tests 2>&1 | Tee-Object -Append windows-native.log
          exit $LASTEXITCODE
      - name: Array and fold callbacks, capture storage and unwind cleanup
        if: ${{ !cancelled() && steps.native_compiler.outcome == 'success' }}
        run: python scripts/run-native-tests.py --targets array_element_ownership array_unwind_ownership fold_ownership right_fold_ownership fold_unwind_ownership --idle-timeout 600 --logs windows-callback-tests
      - name: CPU kernel size validation order
        shell: pwsh
        run: |
          cargo test --test device_bounds device_output_limits_preserve_kernel_validation_order -- --exact
          exit $LASTEXITCODE
      - name: Array bounds and retained GC failure artifacts
        shell: pwsh
        run: |
          cargo test --test array_size_limits array_size_limits_agree_with_raw_interpreter_and_generic_wrappers -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test gc gc_failure_artifacts_retain_the_native_executable -- --exact --nocapture
          exit $LASTEXITCODE
      - name: Publish native diagnostics before dependency builds
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-native-${{ matrix.runner }}
          path: |
            windows-host.txt
            windows-probe.log
            windows-native.log
            windows-resource-tests/
            windows-callback-tests/
      - uses: actions/cache/restore@v6
        id: windows_tls_cache
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Native OpenSSL dependencies
        id: windows_tls
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/setup-windows-tls.ps1
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && inputs.full && env.FWP_WINDOWS_DEPS_READY == '1' && steps.windows_tls_cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Complete compiler unit tests with native TLS
        if: ${{ !cancelled() && inputs.full && steps.windows_tls.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --lib -- --nocapture 2>&1 | Tee-Object windows-unit-tests.log
          exit $LASTEXITCODE
      - name: Native TLS and executable ownership
        id: tls_tests
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          $testTargets = @(
            'list_applicative_ownership', 'typed_state_ownership', 'serializer_leaf_ownership', 'argument_preparation_ownership', 'closure_ownership',
            'retain_unwind_ownership', 'runtime_call_ownership', 'constructor_type_ownership', 'scope_thunk_ownership', 'retained_thunk_ownership',
            'service_value_ownership', 'process_exit_ownership', 'grpc_canonical_encoding', 'grpc_response_encoding', 'grpc_force_cleanup',
            'grpc_render_cleanup', 'grpc_receive_cleanup', 'grpc_status_cleanup', 'grpc_send_cleanup', 'grpc_request_encoding',
            'grpc_client_receive', 'grpc_client_requests', 'grpc_client_failure_text', 'grpc_server_ownership', 'grpc_server_connections',
            'grpc_server_requests', 'grpc_connect_startup', 'grpc_connect_cleanup', 'library_resources', 'service_scope_ownership',
            'service_context_storage', 'grpc_context_restore', 'grpc_context_resources', 'grpc_packed_options', 'grpc_environment_cache',
            'grpc_peer_completion', 'grpc_connection_addresses', 'grpc_tls_pool_identity', 'http2_peer_cleanup', 'http2_client_ownership',
            'http2_server_ownership', 'grpc_capture_resources', 'byte_decoder_ownership', 'text_decoder_ownership', 'web',
            'std_tests', 'tls', 'cli_ownership', 'console_ownership', 'process_ownership',
            'terminal_ownership', 'cli', 'clock_ownership', 'directory_report', 'working_directory',
            'exec_protocol_ownership', 'exec_invocation_ownership', 'arc_tasks', 'arc_execution', 'server_entry_ownership',
            'arc_library', 'transpose_ownership', 'linalg_ownership', 'array_loop_borrows', 'loop_ownership',
            'loop_preparation_ownership', 'nested_loop_boxing', 'field_moves', 'boxed_projection_ownership', 'boxed_field_moves',
            'field_context_ownership', 'unboxed_worker_locals', 'compiler_call_liveness', 'worker_preparation_ownership', 'worker_boxing_ownership',
            'ffi', 'raw_memory_ownership', 'library_input_ownership', 'library_result_ownership', 'record_conversion_ownership',
            'resource_frames', 'resource_frame_fields', 'resource_frame_variants', 'resource_match_context', 'foreign_callback_ownership',
            'float_formats', 'float_linking', 'protocol', 'blocked_matrix', 'wide_workers'
          )
          python scripts/run-native-tests.py --targets $testTargets --idle-timeout 600 --logs windows-tls-tests 2>&1 | Tee-Object windows-tls_tests.log
          exit $LASTEXITCODE
      - name: Native commands, test recovery and executable cache
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        run: python scripts/run-native-tests.py --targets aot --idle-timeout 600 --logs windows-command-tests
      - name: Publish failed native tls and executable ownership log
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.tls_tests.outcome == 'failure' }}
        with:
          name: windows-tls_tests-${{ matrix.runner }}
          path: |
            windows-tls_tests.log
            windows-tls-tests/
          if-no-files-found: error
      - name: Remote stream and queued response lifetimes
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --lib grpc::stream_source_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test grpc stream_aliases_are_consistent_across_tasks -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test grpc queued_response_channels_
          exit $LASTEXITCODE
      - name: Native nested autodiff and ownership controls
        id: autodiff_tests
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --no-fail-fast --test autodiff_precision --test autodiff_nested --test autodiff_checkpoint --test autodiff_library --test ad_tape_scopes --test ad_tape_ownership --test autodiff_workspace --test autodiff_capacity_bounds --test iterator_fusion 2>&1 | Tee-Object windows-autodiff_tests.log
          exit $LASTEXITCODE
      - name: Publish failed native nested autodiff and ownership controls log
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.autodiff_tests.outcome == 'failure' }}
        with:
          name: windows-autodiff_tests-${{ matrix.runner }}
          path: windows-autodiff_tests.log
          if-no-files-found: error
      - name: Complete native golden programs
        id: golden_tests
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --test golden_run native_snapshots -- --exact 2>&1 | Tee-Object windows-golden_tests.log
          exit $LASTEXITCODE
      - name: Native reuse and string ownership
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --no-fail-fast --test reuse --test string_map_ownership --test text_ownership -- --nocapture 2>&1 | Tee-Object windows-reuse_tests.log
          exit $LASTEXITCODE
      - name: Publish native reuse diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-reuse-${{ matrix.runner }}
          path: windows-reuse_tests.log
          if-no-files-found: ignore
      - name: Publish failed complete native golden programs log
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.golden_tests.outcome == 'failure' }}
        with:
          name: windows-golden_tests-${{ matrix.runner }}
          path: windows-golden_tests.log
          if-no-files-found: error
      - name: Build standalone compiler with static C runtime
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --bin fwp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-native.py --output "$env:RUNNER_TEMP/native-package"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: inputs.full && success()
        with:
          name: fwp-Windows-${{ runner.arch }}
          path: ${{ runner.temp }}/native-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-probe-${{ matrix.runner }}
          path: |
            windows-host.txt
            windows-probe.log
            ownership-evidence/udp/
            windows-unit-tests.log
            windows-command-tests/
            windows-resource-tests/
            windows-tls-tests/
            windows-callback-tests/
            ownership-evidence/tail/
            ownership-evidence/direct-captures/
            ownership-evidence/array-captures/
