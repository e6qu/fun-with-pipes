name: Native Windows acceptance
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        required: true
# Optimize the compiler used by long suites while keeping development checks.
# These workflow settings do not change local Cargo defaults or generated-C flags.
env:
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_UDP_ARTIFACTS: ownership-evidence/udp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Native C toolchain for foreign calls
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - name: Native Windows compiler check
        id: native_compiler
        shell: pwsh
        run: |
          rustc -vV | Tee-Object windows-host.txt
          cargo check --all-targets 2>&1 | Tee-Object windows-probe.log
          exit $LASTEXITCODE
      - name: Native socket and library execution
        shell: pwsh
        run: |
          cargo test --lib socket_tests -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib dylib::tests -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib softfloat:: -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib sys::tty::tests::native_console -- --exact 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test softfloat_core --test float_math -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test compiler_options --test native_allocator --test windows_context --test native_sockets --test library_unload -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --bin fwp 2>&1 | Tee-Object -Append windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Language formatting preflight
        shell: pwsh
        run: |
          ./target/debug/fwp.exe fmt --check lib examples docs/tutorials bench
          exit $LASTEXITCODE
      - name: Interpreter golden outputs and exit statuses
        shell: pwsh
        run: |
          cargo test --test golden_run interpreter_snapshots -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          exit $LASTEXITCODE
      - name: Generated programs with native resources and ownership stress
        shell: pwsh
        run: |
          cargo test --no-fail-fast --test cpu_kernel_ownership --test metrics_ownership --test ternary_ownership --test udp_ownership --test dns_ownership --test vector_ownership --test range_array --test hash_ownership --test mapped_array_construction --test zip_map_fusion --test unzip_cleanup --test list_construction_cleanup --test list_generation_ownership --test list_structure_ownership --test state_sequence_ownership --test map_unwind_ownership --test map_set_ownership --test selection_unwind_ownership --test zip_unwind_ownership --test fold_unwind_ownership --test windows_runtime --test windows_static_memory --test loop_unwind_ownership --test path_validation --test io_error_ownership --test system_snapshots --test file_values --test text_file_tools --test file_construction_ownership --test file_inline_path --test file_storage_disposal -- --nocapture 2>&1 | Tee-Object -Append windows-native.log
          exit $LASTEXITCODE
      - name: CPU kernel size validation order
        shell: pwsh
        run: |
          cargo test --test device_bounds device_output_limits_preserve_kernel_validation_order -- --exact
          exit $LASTEXITCODE
      - name: Publish native diagnostics before dependency builds
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-native-${{ matrix.runner }}
          path: |
            windows-host.txt
            windows-probe.log
            windows-native.log
      - uses: actions/cache/restore@v6
        id: windows_tls_cache
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Native OpenSSL dependencies
        id: windows_tls
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/setup-windows-tls.ps1
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && inputs.full && env.FWP_WINDOWS_DEPS_READY == '1' && steps.windows_tls_cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Native TLS and executable ownership
        id: tls_tests
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --no-fail-fast --test argument_preparation_ownership --test closure_ownership --test retain_unwind_ownership --test runtime_call_ownership --test constructor_type_ownership --test scope_thunk_ownership --test retained_thunk_ownership --test service_value_ownership --test process_exit_ownership --test grpc_canonical_encoding --test grpc_response_encoding --test grpc_force_cleanup --test grpc_render_cleanup --test grpc_receive_cleanup --test grpc_status_cleanup --test grpc_send_cleanup --test grpc_request_encoding --test grpc_client_receive --test grpc_client_requests --test grpc_client_failure_text --test grpc_server_ownership --test grpc_server_connections --test grpc_server_requests --test grpc_connect_startup --test grpc_connect_cleanup --test library_resources --test service_scope_ownership --test service_context_storage --test grpc_context_restore --test grpc_context_resources --test grpc_packed_options --test grpc_environment_cache --test grpc_peer_completion --test grpc_connection_addresses --test grpc_tls_pool_identity --test http2_peer_cleanup --test http2_client_ownership --test http2_server_ownership --test grpc_capture_resources --test byte_decoder_ownership --test text_decoder_ownership --test web --test std_tests --test tls --test cli_ownership --test console_ownership --test process_ownership --test terminal_ownership --test cli --test clock_ownership --test directory_report --test working_directory --test exec_protocol_ownership --test exec_invocation_ownership --test arc_tasks --test arc_execution --test server_entry_ownership --test arc_library --test transpose_ownership --test linalg_ownership --test array_loop_borrows --test field_moves --test boxed_projection_ownership --test boxed_field_moves --test field_context_ownership --test unboxed_worker_locals --test compiler_call_liveness --test worker_preparation_ownership --test worker_boxing_ownership --test ffi --test library_input_ownership --test library_result_ownership --test record_conversion_ownership --test resource_frames --test resource_frame_fields --test resource_frame_variants --test resource_match_context --test foreign_callback_ownership --test float_formats --test float_linking --test protocol --test blocked_matrix --test wide_workers 2>&1 | Tee-Object windows-tls_tests.log
          exit $LASTEXITCODE
      - name: Native cache tracks C header search paths
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        run: cargo test --test aot integer_cache_tracks_header_search_paths -- --exact
      - name: Publish failed native tls and executable ownership log
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.tls_tests.outcome == 'failure' }}
        with:
          name: windows-tls_tests-${{ matrix.runner }}
          path: windows-tls_tests.log
          if-no-files-found: error
      - name: Shared remote stream lifetimes
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --lib grpc::stream_source_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test grpc stream_aliases_are_consistent_across_tasks -- --exact
          exit $LASTEXITCODE
      - name: Native nested autodiff and ownership controls
        id: autodiff_tests
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --no-fail-fast --test autodiff_precision --test autodiff_nested --test autodiff_checkpoint --test autodiff_library --test ad_tape_scopes --test ad_tape_ownership --test autodiff_workspace --test autodiff_capacity_bounds --test iterator_fusion 2>&1 | Tee-Object windows-autodiff_tests.log
          exit $LASTEXITCODE
      - name: Publish failed native nested autodiff and ownership controls log
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.autodiff_tests.outcome == 'failure' }}
        with:
          name: windows-autodiff_tests-${{ matrix.runner }}
          path: windows-autodiff_tests.log
          if-no-files-found: error
      - name: Complete native golden programs
        id: golden_tests
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --test golden_run native_snapshots -- --exact 2>&1 | Tee-Object windows-golden_tests.log
          exit $LASTEXITCODE
      - name: Publish failed complete native golden programs log
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.golden_tests.outcome == 'failure' }}
        with:
          name: windows-golden_tests-${{ matrix.runner }}
          path: windows-golden_tests.log
          if-no-files-found: error
      - name: Build standalone compiler with static C runtime
        if: ${{ !cancelled() && inputs.full && steps.native_compiler.outcome == 'success' }}
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --bin fwp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-native.py --output "$env:RUNNER_TEMP/native-package"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: inputs.full && success()
        with:
          name: fwp-Windows-${{ runner.arch }}
          path: ${{ runner.temp }}/native-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-probe-${{ matrix.runner }}
          path: |
            windows-host.txt
            windows-probe.log
            ownership-evidence/udp/
