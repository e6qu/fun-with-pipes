name: Scalar borrow and array reuse preparation
on:
  push:
    branches: [ownership-evidence-borrowed-scalar-reuse]
jobs:
  reuse:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Format and validate compiler
        run: |
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Preserve original in-place allocation thresholds
        run: cargo test --test reuse unique_arrays_are_written_in_place -- --nocapture
      - name: Borrowed fields, loop ownership and unwind
        run: cargo test --no-fail-fast --test field_context_ownership --test loop_ownership --test retain_unwind_ownership --test numeric_array_fusion
      - name: Export formatted source
        if: always()
        run: |
          mkdir -p scalar-reuse-evidence
          cp src/rc.rs scalar-reuse-evidence/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scalar-reuse-${{ matrix.runner }}
          path: scalar-reuse-evidence/
