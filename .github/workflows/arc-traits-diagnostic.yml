name: ARC traits live-owner diagnosis
on:
  push:
    branches: [ownership-evidence-arc-traits-diagnostic]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compile retained failing C and record remaining owners
        run: |
          clang -O1 -std=gnu11 -ffp-contract=off tests/fixtures/arc-traits-diagnostic.c -o /tmp/arc-traits -lm -lpthread -ldl
          set +e
          /tmp/arc-traits > /tmp/traits.stdout 2> /tmp/traits.stderr
          status=$?
          cat /tmp/traits.stderr
          test "$status" -eq 193
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arc-traits-live-owners
          path: /tmp/traits.*
