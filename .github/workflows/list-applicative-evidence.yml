name: Typed list applicative and flat-map callback ownership
on:
  push:
    branches: [ownership-evidence-list-applicative]
permissions:
  contents: read
jobs:
  applicative:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Record hardware, compiler and every native compiler invocation
        run: |
          export FWP_LIST_AP_ARTIFACTS="$RUNNER_TEMP/list-applicative"
          echo "FWP_LIST_AP_ARTIFACTS=$FWP_LIST_AP_ARTIFACTS" >> "$GITHUB_ENV"
          mkdir -p "$FWP_LIST_AP_ARTIFACTS"
          git rev-parse HEAD > "$FWP_LIST_AP_ARTIFACTS/head.txt"
          uname -a > "$FWP_LIST_AP_ARTIFACTS/hardware.txt"
          clang --version > "$FWP_LIST_AP_ARTIFACTS/compiler.txt"
          rustc --version > "$FWP_LIST_AP_ARTIFACTS/rustc.txt"
          cat > "$FWP_LIST_AP_ARTIFACTS/record-cc" <<'SH'
          #!/bin/sh
          printf 'clang argument vector\n' >> "$FWP_LIST_AP_ARTIFACTS/compiler-invocations.txt"
          printf '%s\n' "$@" >> "$FWP_LIST_AP_ARTIFACTS/compiler-invocations.txt"
          exec clang "$@"
          SH
          chmod +x "$FWP_LIST_AP_ARTIFACTS/record-cc"
          echo "CC=$FWP_LIST_AP_ARTIFACTS/record-cc" >> "$GITHUB_ENV"
      - name: Preserve formatting suggestions without changing tested source
        run: |
          rustfmt src/cgen.rs src/ownership.rs tests/list_applicative_ownership.rs
          mkdir -p "$FWP_LIST_AP_ARTIFACTS/formatted/src" "$FWP_LIST_AP_ARTIFACTS/formatted/tests"
          cp src/cgen.rs src/ownership.rs "$FWP_LIST_AP_ARTIFACTS/formatted/src/"
          cp tests/list_applicative_ownership.rs "$FWP_LIST_AP_ARTIFACTS/formatted/tests/"
          git diff > "$FWP_LIST_AP_ARTIFACTS/format.patch"
          git restore src/cgen.rs src/ownership.rs tests/list_applicative_ownership.rs
      - name: Focused lint and declared ownership contracts
        run: |
          cargo clippy --lib --test list_applicative_ownership -- -D warnings
          cargo test --lib -- --nocapture
      - name: Native applicative/flat-map ownership, unwind, cancellation and alias controls
        run: |
          cargo test --test list_applicative_ownership -- --nocapture
          git diff --exit-code
          shasum -a 256 src/cgen.rs src/ownership.rs runtime/fwp_rt_prims.c tests/list_applicative_ownership.rs tests/fixtures/list_ap_probe.c target/debug/fwp > "$FWP_LIST_AP_ARTIFACTS/source-binary-hashes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: list-applicative-${{ matrix.runner }}
          path: ${{ runner.temp }}/list-applicative/
