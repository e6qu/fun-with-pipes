name: Equivalent scoped gradient allocation comparison
on:
  push:
    branches: [ownership-evidence-autodiff-allocations]
permissions:
  contents: read
jobs:
  allocations:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FWP_SCOPE_CANDIDATE: fbc7e38087b3708c60d21302e29b9013c7d6fa2c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Record compiler arguments and hardware
        run: |
          export FWP_AD_ALLOCATION_ARTIFACTS="$RUNNER_TEMP/scope-allocations"
          echo "FWP_AD_ALLOCATION_ARTIFACTS=$FWP_AD_ALLOCATION_ARTIFACTS" >> "$GITHUB_ENV"
          mkdir -p "$FWP_AD_ALLOCATION_ARTIFACTS"
          git rev-parse HEAD > "$FWP_AD_ALLOCATION_ARTIFACTS/driver.txt"
          uname -a > "$FWP_AD_ALLOCATION_ARTIFACTS/hardware.txt"
          clang --version > "$FWP_AD_ALLOCATION_ARTIFACTS/compiler.txt"
          rustc --version > "$FWP_AD_ALLOCATION_ARTIFACTS/rustc.txt"
          cat > "$FWP_AD_ALLOCATION_ARTIFACTS/record-cc" <<'SH'
          #!/bin/sh
          printf 'clang argument vector\n' >> "$FWP_AD_ALLOCATION_ARTIFACTS/compiler-invocations.txt"
          printf '%s\n' "$@" >> "$FWP_AD_ALLOCATION_ARTIFACTS/compiler-invocations.txt"
          exec clang "$@"
          SH
          chmod +x "$FWP_AD_ALLOCATION_ARTIFACTS/record-cc"
          echo "CC=$FWP_AD_ALLOCATION_ARTIFACTS/record-cc" >> "$GITHUB_ENV"
      - name: Compare equivalent O1 and O2 allocations
        run: python3 scripts/measure-ad-scope-allocations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scope-allocations-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/scope-allocations/*.txt
            ${{ runner.temp }}/scope-allocations/*.json
            ${{ runner.temp }}/scope-allocations/*.fwp
            ${{ runner.temp }}/scope-allocations/*.c
            ${{ runner.temp }}/scope-allocations/*.rs
            ${{ runner.temp }}/scope-allocations/*-O1
            ${{ runner.temp }}/scope-allocations/*-O2
            ${{ runner.temp }}/scope-allocations/*.stdout
            ${{ runner.temp }}/scope-allocations/*.stderr
            ${{ runner.temp }}/scope-allocations/*.status
