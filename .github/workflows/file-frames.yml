name: Focused File lifetimes and original resource frames

on:
  push:
    branches: [ownership-evidence-file-frames]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test file_construction_ownership --test file_write_visibility --test file_io_errors --test file_read_kinds --test resource_frames --test file_runtime_ownership --test file_discard_ownership --test file_runtime_boundaries --test nested_loop_boxing --test loop_unwind_ownership --test old_reclamation --test ownership --test gc --test stack --test reuse -- -D warnings
      - name: File I/O, original frames, logical owners and exceptional cleanup
        if: ${{ !cancelled() }}
        run: cargo test --test file_construction_ownership --test file_write_visibility --test file_io_errors --test file_read_kinds --test resource_frames --test file_runtime_ownership --test file_discard_ownership --test file_runtime_boundaries --test nested_loop_boxing --test loop_unwind_ownership --test old_reclamation --test ownership --test stack --test reuse --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: Primitive boundary consistency
        if: ${{ !cancelled() }}
        run: cargo test --lib ownership::tests::declared_collection_and_text_boundaries_have_consistent_contracts -- --exact
      - name: Resource metadata and fusion order
        if: ${{ !cancelled() }}
        run: cargo test --lib resource::tests -- --nocapture
      - name: All ownership IR controls including CAF, scalar and matched-result owners
        if: ${{ !cancelled() }}
        run: cargo test --lib rc::tests
