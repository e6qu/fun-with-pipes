name: Packed numeric array and typed worker controls
on:
  push:
    branches: [ownership-evidence-packed-numeric-arrays]
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Current bytes, original semantics and diagnostic ABI
        env:
          FWP_NUMERIC_LAYOUT_ARTIFACTS: ${{ runner.temp }}/numeric-layout-baseline
        run: |
          mkdir -p "$FWP_NUMERIC_LAYOUT_ARTIFACTS"
          rustfmt --edition 2021 src/cgen.rs
          cp src/cgen.rs "$FWP_NUMERIC_LAYOUT_ARTIFACTS/cgen.formatted.rs"
          cargo clippy --lib -- -D warnings
          cargo test --lib
      - name: Original ownership and allocation boundary controls
        run: cargo test --test array_element_ownership --test array_size_limits --test kernel_stack_bounds --test device_bounds --test worker_boxing_ownership --test worker_preparation_ownership --test numerics --test golden_check --no-fail-fast -- --nocapture
      - name: Exact packed bytes and raw native mode comparisons
        if: ${{ !cancelled() }}
        env:
          FWP_NUMERIC_LAYOUT_ARTIFACTS: ${{ runner.temp }}/numeric-layout-baseline
        run: python3 scripts/measure-packed-numeric-arrays.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numeric-layout-metadata-${{ matrix.runner }}
          path: ${{ runner.temp }}/numeric-layout-baseline/*.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numeric-layout-controls-${{ matrix.runner }}
          path: ${{ runner.temp }}/numeric-layout-baseline/
