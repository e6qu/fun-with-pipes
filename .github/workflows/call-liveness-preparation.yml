name: Focused compiler call liveness preparation

on:
  push:
    branches: [ownership-evidence-call-liveness]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --test gc -- -D warnings
      - name: Call preparation, cancellation and exceptional cleanup
        if: ${{ !cancelled() }}
        run: cargo test --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
