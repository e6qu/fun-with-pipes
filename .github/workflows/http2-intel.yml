name: HTTP2 strict owner fixture across native compilers

on:
  push:
    branches: [ownership-evidence-http2-intel]

jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cc: gcc
          - runner: ubuntu-latest
            cc: clang
          - runner: macos-15
            cc: clang
          - runner: macos-15-intel
            cc: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: ${{ matrix.cc }}
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain merged preparation review heads
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Docs and immutable ancestry
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Focused lint
        run: cargo clippy --test http2_body_roots --test tls_alpn_roots --test library_resources -- -D warnings
      - name: Strict omission and original resource controls
        env:
          FWP_HTTP2_C_DIAGNOSTIC: ${{ runner.temp }}/http2-owner.c
        run: cargo test --test http2_body_roots --test tls_alpn_roots --test library_resources --no-fail-fast
      - name: Actual collection
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: Ownership checkpoints
        run: cargo test --lib rc::tests -- --nocapture
      - name: Exact strict omission assembly
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, subprocess
          directory = Path(os.environ['RUNNER_TEMP'])
          args = [os.environ['CC'], '-O2', '-std=gnu11', '-ffp-contract=off', '-w', '-S', str(directory / 'http2-owner.c'), '-o', str(directory / 'http2-owner.s')]
          if os.environ.get('FWP_OPENSSL_DIR'):
              args += ['-I' + os.environ['FWP_OPENSSL_DIR'] + '/include']
          subprocess.run(args, check=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http2-owner-${{ matrix.runner }}-${{ matrix.cc }}
          path: |
            ${{ runner.temp }}/http2-owner.c
            ${{ runner.temp }}/http2-owner.s
