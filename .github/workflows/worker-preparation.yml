name: Focused constructor and worker preparation

on:
  push:
    branches: [ownership-evidence-worker-preparation]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test worker_preparation_ownership --test worker_boxing_ownership --test constructor_unwind_ownership --test argument_preparation_ownership --test loop_unwind_ownership --test fold_unwind_ownership --test zip_unwind_ownership --test selection_unwind_ownership --test map_unwind_ownership --test runtime_call_ownership --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --test gc -- -D warnings
      - name: Constructor fields, result boxing and worker-entry cleanup
        if: ${{ !cancelled() }}
        run: cargo test --test worker_preparation_ownership --test worker_boxing_ownership --test constructor_unwind_ownership --test argument_preparation_ownership --test loop_unwind_ownership --test fold_unwind_ownership --test zip_unwind_ownership --test selection_unwind_ownership --test map_unwind_ownership --test runtime_call_ownership --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: Constructor liveness transfer
        if: ${{ !cancelled() }}
        run: cargo test --lib rc::tests::constructors_transfer_fields_and_keep_other_caller_owners -- --exact
