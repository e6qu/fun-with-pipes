name: Roadmap documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  roadmap_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Retain review heads for preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Documentation audit controls
        run: python3 scripts/test-roadmap.py
      - name: Documentation, immutable tags and commit messages
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Tutorial code and output copies
        run: |
          CARGO_MANIFEST_DIR="$PWD" CARGO_BIN_EXE_fwp="$PWD/target/debug/fwp" rustc --edition=2021 --test tests/examples.rs -o "$RUNNER_TEMP/fwp-tutorial-doc-check"
          "$RUNNER_TEMP/fwp-tutorial-doc-check" --exact tutorial_readmes_match_their_programs
      - name: Local guard sampling integration checks
        run: python3 scripts/test-local-guard.py
      - name: Native test coverage and failure propagation
        run: python3 scripts/test-native-test-runner.py
      - name: Collection evidence completeness and memory controls
        run: python3 scripts/test-collection-evidence.py
      - name: Ownership operation evidence controls
        run: python3 scripts/test-ownership-profile.py
      - name: Sorting-time evidence controls
        run: python3 scripts/test-sort-time-evidence.py
