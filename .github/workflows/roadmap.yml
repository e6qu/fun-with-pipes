name: Roadmap documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  roadmap_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Retain review heads for preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Documentation audit controls
        run: python3 scripts/test-roadmap.py
      - name: Documentation, immutable tags and commit messages
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Tutorial code and output copies
        run: |
          CARGO_MANIFEST_DIR="$PWD" CARGO_BIN_EXE_fwp="$PWD/target/debug/fwp" rustc --edition=2021 --test tests/examples.rs -o "$RUNNER_TEMP/fwp-tutorial-doc-check"
          "$RUNNER_TEMP/fwp-tutorial-doc-check" --exact tutorial_readmes_match_their_programs
      - name: Local guard sampling integration checks
        run: python3 scripts/test-local-guard.py
      - name: Native test coverage and failure propagation
        run: python3 scripts/test-native-test-runner.py
      - name: Evidence archive integrity and read-failure controls
        run: python3 scripts/test-package-evidence.py
      - name: Collection evidence completeness and memory controls
        run: python3 scripts/test-collection-evidence.py
      - name: Ownership operation evidence controls
        run: python3 scripts/test-ownership-profile.py
      - name: Sorting-time evidence controls
        run: python3 scripts/test-sort-time-evidence.py
      - name: Parser measurement evidence controls
        run: python3 scripts/test-parser-workspace-evidence.py
      - name: Recursion measurement evidence controls
        run: python3 scripts/test-mutual-recursion.py
      - name: Kernel result oracle and scheduling controls
        run: python3 scripts/test-numerical-baselines.py
      - name: Timing diagnostic observation and output controls
        run: python3 scripts/test-timing-diagnostic.py
      - name: Child CPU and scheduling observation controls
        run: python3 scripts/test-timing-resources.py
      - name: Word-frequency failure-output controls
        run: python3 scripts/test-current-wordfreq.py
      - name: Retained word-frequency observations and rejection controls
        run: |
          for machine in aarch64 x86_64; do
            for session in 1 2; do
              python3 scripts/test-current-wordfreq-evidence.py \
                --retained-index docs/measurements/wordfreq-current-artifacts-2026-10-30.json \
                --source dc963bb500748dabe393dfaed20f92a333f5996e \
                --machine "$machine" --session "$session"
            done
          done
      - name: Rejected direct-string observations and evidence controls
        run: |
          for machine in aarch64 x86_64; do
            for session in 1 2; do
              python3 scripts/test-direct-string-results.py \
                --retained-index docs/measurements/direct-strings-first-artifacts-2026-10-30.json \
                --source 8da8f4cf98421b5171b158d3734298cc01fd6865 \
                --machine "$machine" --session "$session"
            done
          done
      - name: Rejected unique-string observations and evidence controls
        run: |
          for machine in aarch64 x86_64; do
            for session in 1 2; do
              python3 scripts/test-direct-string-results.py \
                --retained-index docs/measurements/string-reuse-artifacts-2026-10-30.json \
                --source d7c609890da12a5eb71319cb42593fe514be2015 \
                --machine "$machine" --session "$session"
              python3 scripts/check-string-reuse-counts.py \
                --retained-index docs/measurements/string-reuse-artifacts-2026-10-30.json "$machine" "$session" \
                --source d7c609890da12a5eb71319cb42593fe514be2015
            done
          done
      - name: Qualified byte-search measurements and allocation budgets
        run: |
          for machine in aarch64 x86_64; do
            for session in 1 2; do
              python3 scripts/test-direct-string-results.py \
                --retained-index docs/measurements/byte-search-artifacts-2026-10-30.json \
                --source afbafef8d06f2b892e9cc93b4d6a3f52d153b3fa \
                --machine "$machine" --session "$session"
              python3 scripts/check-direct-string-results.py \
                --retained-index docs/measurements/byte-search-artifacts-2026-10-30.json \
                --source afbafef8d06f2b892e9cc93b4d6a3f52d153b3fa \
                --machine "$machine" --session "$session" --decision passing
              python3 scripts/check-string-reuse-counts.py \
                --retained-index docs/measurements/byte-search-artifacts-2026-10-30.json "$machine" "$session" \
                --source afbafef8d06f2b892e9cc93b4d6a3f52d153b3fa
            done
          done
      - name: Kernel baseline archive and altered-evidence controls
        run: python3 scripts/test-kernel-baseline-evidence.py
      - name: Derivative process scheduling and host qualification controls
        run: python3 scripts/test-descent-schedule.py
      - name: Derivative baseline completeness controls
        run: python3 scripts/test-descent-baselines.py
      - name: Retained derivative baseline reports
        run: python3 scripts/check-descent-baselines.py --archive docs/measurements/descent-baseline-artifacts-2026-10-29.json
      - name: Derivative comparison limits and exact capture reference
        run: |
          python3 scripts/test-descent-budgets.py
          python3 scripts/test-capture-reference.py
      - name: Matched-host evidence rejection controls
        run: python3 scripts/test-descent-groups.py
      - name: Matched grouped-process baselines and noisy controls
        run: python3 scripts/check-descent-groups.py --archive docs/measurements/descent-groups-artifacts-2026-10-29.json --protocol grouped
      - name: Repeated-solve baselines and fixed noise qualification
        run: python3 scripts/check-descent-groups.py --archive docs/measurements/descent-repeated-artifacts-2026-10-29.json --protocol repeated
      - name: Preserve rejected scalar recording results
        run: python3 scripts/check-descent-groups.py --archive docs/measurements/descent-recording-artifacts-2026-10-29.json --protocol recording
      - name: Audit accepted eager capture comparisons
        run: |
          python3 scripts/check-descent-groups.py --archive docs/measurements/eager-captures-artifacts-2026-10-29.json --protocol eager-captures
          python3 scripts/check-descent-groups.py --archive docs/measurements/eager-captures-recheck-artifacts-2026-10-29.json --protocol eager-captures
      - name: Derivative depth evidence rejection controls
        run: python3 scripts/test-ad-depth.py
      - name: Retained derivative depth costs before and after stack recording
        run: |
          python3 scripts/check-ad-depth.py --archive docs/measurements/ad-depth-artifacts-2026-10-29.json
          python3 scripts/check-ad-depth.py --archive docs/measurements/ad-depth-recording-artifacts-2026-10-29.json
      - name: Derivative output comparison controls
        run: python3 scripts/test-descent-output-baselines.py
      - name: Retained output comparisons and inconclusive decisions
        run: python3 scripts/check-descent-output-baselines.py --archive docs/measurements/descent-output-current-artifacts-2026-10-29.json
      - name: CPU baseline completeness and budget controls
        run: python3 scripts/test-cpu-baselines.py
      - name: Decimal-count proof and timing controls
        run: python3 scripts/test-decimal-count.py
      - name: Preserve rejected decimal-count measurements
        run: python3 scripts/check-decimal-records.py
      - name: Preserve longer decimal sessions and their original decisions
        run: |
          python3 scripts/check-decimal-repeat.py --protocol long --expected-decision not-accepted \
            --archive docs/measurements/decimal-long-artifacts-2026-10-29.json \
            --reports docs/measurements/decimal-long-2026-10-29-arm-1.json docs/measurements/decimal-long-2026-10-29-arm-2.json docs/measurements/decimal-long-2026-10-29-amd-1.json docs/measurements/decimal-long-2026-10-29-amd-2.json \
            --table docs/measurements/cpu-budgets-2026-10-28.json \
            --source 0c904dc859439a8a6e31e7bdf30c87ca69821de7
      - name: Preserve the position-rotated experiment and its schedule limitation
        run: |
          python3 scripts/check-decimal-repeat.py --protocol interleaved --expected-decision not-accepted \
            --archive docs/measurements/decimal-interleaved-artifacts-2026-10-29.json \
            --reports docs/measurements/decimal-interleaved-2026-10-29-arm-1.json docs/measurements/decimal-interleaved-2026-10-29-arm-2.json docs/measurements/decimal-interleaved-2026-10-29-amd-1.json docs/measurements/decimal-interleaved-2026-10-29-amd-2.json \
            --table docs/measurements/cpu-budgets-2026-10-28.json \
            --source e8a8cb8fefceaa8e955823f3c1d6edb737bf789e
      - name: Verify accepted balanced decimal comparisons
        run: |
          python3 scripts/check-decimal-repeat.py --protocol balanced --expected-decision accepted \
            --archive docs/measurements/decimal-balanced-artifacts-2026-10-29.json \
            --reports docs/measurements/decimal-balanced-2026-10-29-arm-1.json docs/measurements/decimal-balanced-2026-10-29-arm-2.json docs/measurements/decimal-balanced-2026-10-29-amd-1.json docs/measurements/decimal-balanced-2026-10-29-amd-2.json \
            --table docs/measurements/cpu-budgets-2026-10-28.json \
            --source 0c84afe98baec2b771fd416aced35eb4d6c11a24
      - name: CPU execution-phase evidence controls
        run: python3 scripts/test-cpu-phases.py
      - name: Verify retained CPU execution diagnostics
        run: |
          python3 scripts/cpu-phases.py verify \
            --reports docs/measurements/cpu-phases-2026-10-29-arm.json docs/measurements/cpu-phases-2026-10-29-amd.json \
            --unqualified docs/measurements/cpu-phases-2026-10-29-unqualified.json \
            --artifacts docs/measurements/cpu-phases-artifacts-2026-10-29.json \
            --table docs/measurements/cpu-budgets-2026-10-28.json
      - name: Scalar candidate comparison controls
        run: python3 scripts/test-scalar-bounds.py
      - name: Verify frozen CPU limits against all original sessions
        run: |
          python3 scripts/cpu-baselines.py verify \
            --reports docs/measurements/cpu-baseline-2026-10-28-*.json \
            --table docs/measurements/cpu-budgets-2026-10-28.json
      - name: Verify rejected scalar-bound experiments and source variants
        run: |
          python3 scripts/scalar-bounds.py \
            --reports docs/measurements/scalar-bounds-2026-10-29-arm.json docs/measurements/scalar-bounds-2026-10-29-amd.json \
            --unqualified docs/measurements/scalar-bounds-2026-10-29-unqualified.json \
            --table docs/measurements/cpu-budgets-2026-10-28.json \
            --artifacts docs/measurements/scalar-bounds-artifacts-2026-10-29.json
