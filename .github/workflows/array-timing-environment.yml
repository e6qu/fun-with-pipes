name: Array timing environment
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Completed fresh-array measurement run
        type: string
        required: true
      source_revision:
        description: Full measured source commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  affinity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      EVIDENCE_SOURCE: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check timing controls
        run: python3 scripts/test-borrowed-array-costs.py
      - name: Compare explicit CPU placement with identical saved binaries
        run: >-
          python3 scripts/diagnose-array-affinity.py --run "$EVIDENCE_RUN"
          --source "$EVIDENCE_SOURCE" --processor-index 0
          --cpu 'AMD EPYC 7763 64-Core Processor'
          --cpu 'AMD EPYC 9V74 80-Core Processor'
          --cpu 'AMD EPYC 9V45 96-Core Processor'
          --taskset /usr/bin/taskset --time /usr/bin/time --output array-affinity
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: array-affinity
          path: array-affinity/
          if-no-files-found: error
