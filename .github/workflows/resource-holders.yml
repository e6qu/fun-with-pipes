name: Focused typed resource holders and explicit cycle lifetimes

on:
  push:
    branches: [ownership-evidence-resource-holders]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test resource_frame_fields --test file_inline_path --test file_storage_disposal --test file_construction_disposal --test resource_frame_variants --test stack_match_ownership --test resource_match_context --test channel_cycle_ownership --test channel_queue_ownership --test resource_frames --test file_runtime_boundaries --test old_reclamation --test ownership --test gc --test stack --test reuse -- -D warnings
      - name: Typed holders, nominal contexts, File storage and explicit cycle draining
        if: ${{ !cancelled() }}
        run: cargo test --test resource_frame_fields --test file_inline_path --test file_storage_disposal --test file_construction_disposal --test resource_frame_variants --test stack_match_ownership --test resource_match_context --test channel_cycle_ownership --test channel_queue_ownership --test resource_frames --test file_runtime_boundaries --test old_reclamation --test ownership --test stack --test reuse --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: Primitive boundary consistency
        if: ${{ !cancelled() }}
        run: cargo test --lib ownership::tests::declared_collection_and_text_boundaries_have_consistent_contracts -- --exact
      - name: Resource metadata and fusion order
        if: ${{ !cancelled() }}
        run: cargo test --lib resource::tests -- --nocapture
      - name: All ownership IR controls including pending CAF and scalar owners
        if: ${{ !cancelled() }}
        run: cargo test --lib rc::tests
