name: FFI pointer arithmetic boundary preparation
on:
  push:
    branches: [ownership-ffi-pointer-arithmetic]
jobs:
  boundary:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Retain preparation anchors
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Docs and immutable anchors
        run: python3 scripts/check-roadmap.py
      - name: Linux headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Focused lint
        run: cargo clippy --test ffi_pointer_arithmetic -- -D warnings
      - name: Pointer-width boundaries, raw/native oracles and signed-overflow control
        run: cargo test --test ffi_pointer_arithmetic -- --nocapture
