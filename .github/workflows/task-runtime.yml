name: Focused cache and task runtime ownership

on:
  push:
    branches: [ownership-evidence-task-runtime]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test task_handle_ownership --test scope_thunk_ownership --test within_thunk_ownership --test retained_thunk_ownership --test inline_caf_ownership --test caf_ownership --test field_context_ownership --test match_context_ownership --test variant_alias_ownership --test record_conversion_ownership --test general_record_update_ownership --test record_update_ownership --test variant_conversion_ownership --test constructor_type_ownership --test retain_unwind_ownership --test loop_preparation_ownership --test worker_preparation_ownership --test worker_boxing_ownership --test constructor_unwind_ownership --test argument_preparation_ownership --test loop_unwind_ownership --test fold_unwind_ownership --test zip_unwind_ownership --test selection_unwind_ownership --test map_unwind_ownership --test runtime_call_ownership --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --test gc --test stack --test reuse -- -D warnings
      - name: Cache lifetimes, retained callbacks and task handle teardown
        if: ${{ !cancelled() }}
        run: cargo test --test task_handle_ownership --test scope_thunk_ownership --test within_thunk_ownership --test retained_thunk_ownership --test inline_caf_ownership --test caf_ownership --test field_context_ownership --test match_context_ownership --test variant_alias_ownership --test record_conversion_ownership --test general_record_update_ownership --test record_update_ownership --test variant_conversion_ownership --test constructor_type_ownership --test retain_unwind_ownership --test loop_preparation_ownership --test worker_preparation_ownership --test worker_boxing_ownership --test constructor_unwind_ownership --test argument_preparation_ownership --test loop_unwind_ownership --test fold_unwind_ownership --test zip_unwind_ownership --test selection_unwind_ownership --test map_unwind_ownership --test runtime_call_ownership --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --test stack --test reuse --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: All ownership IR controls including matched results and pending owners
        if: ${{ !cancelled() }}
        run: cargo test --lib rc::tests
      - name: Primitive boundary consistency
        if: ${{ !cancelled() }}
        run: cargo test --lib ownership::tests::declared_collection_and_text_boundaries_have_consistent_contracts -- --exact
