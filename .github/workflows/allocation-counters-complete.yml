name: Complete AD and list allocator comparisons
on:
  push:
    branches: [ownership-evidence-allocation-counters-complete]
permissions:
  contents: read
jobs:
  allocations:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Record hardware, source identity and native compiler arguments
        run: |
          export FWP_TYPED_STATE_ARTIFACTS="$RUNNER_TEMP/typed-state-allocation"
          echo "FWP_TYPED_STATE_ARTIFACTS=$FWP_TYPED_STATE_ARTIFACTS" >> "$GITHUB_ENV"
          mkdir -p "$FWP_TYPED_STATE_ARTIFACTS"
          git rev-parse HEAD > "$FWP_TYPED_STATE_ARTIFACTS/driver.txt"
          uname -a > "$FWP_TYPED_STATE_ARTIFACTS/hardware.txt"
          clang --version > "$FWP_TYPED_STATE_ARTIFACTS/compiler.txt"
          rustc --version > "$FWP_TYPED_STATE_ARTIFACTS/rustc.txt"
          cat > "$FWP_TYPED_STATE_ARTIFACTS/record-cc" <<'SH'
          #!/bin/sh
          printf 'clang argument vector\n' >> "$FWP_TYPED_STATE_ARTIFACTS/compiler-invocations.txt"
          printf '%s\n' "$@" >> "$FWP_TYPED_STATE_ARTIFACTS/compiler-invocations.txt"
          exec clang "$@"
          SH
          chmod +x "$FWP_TYPED_STATE_ARTIFACTS/record-cc"
          echo "CC=$FWP_TYPED_STATE_ARTIFACTS/record-cc" >> "$GITHUB_ENV"
      - name: Equivalent gradients with complete managed counters
        env:
          FWP_AD_ALLOCATION_ARTIFACTS: ${{ runner.temp }}/typed-state-allocation/ad
          FWP_SCOPE_CANDIDATE: fbc7e38087b3708c60d21302e29b9013c7d6fa2c
        run: python3 scripts/measure-ad-scope-allocations-complete.py
      - name: Equivalent list callbacks with complete managed counters
        env:
          FWP_LIST_AP_ARTIFACTS: ${{ runner.temp }}/typed-state-allocation/list
        run: python3 scripts/measure-list-callback-allocations-complete.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-allocation-counters-${{ matrix.runner }}
          path: ${{ runner.temp }}/typed-state-allocation/
