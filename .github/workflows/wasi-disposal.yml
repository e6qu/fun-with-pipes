name: Focused actual WASI resource counts and disposal

on:
  push:
    branches: [ownership-evidence-wasi-disposal]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_REQUIRE_WASM_RESOURCE_COUNTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff and immutable anchors
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Actual WASI compiler and TLS headers
        run: sudo apt-get update && sudo apt-get install -y clang lld wasi-libc libclang-rt-18-dev-wasm32 libssl-dev openssl
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test wasm_resource_counts --test file_runtime_boundaries --test file_discard_ownership --test file_runtime_ownership --test resource_frames --test ownership --test gc --test stack --test reuse -- -D warnings
      - name: WebAssembly compiler lint
        if: ${{ !cancelled() }}
        run: cargo clippy --target wasm32-wasip1 -- -D warnings
      - name: Actual WASI File Task and Channel counts and free variants
        if: ${{ !cancelled() }}
        run: cargo test --test wasm_resource_counts --test file_runtime_boundaries --test file_discard_ownership --test file_runtime_ownership --test resource_frames --test ownership --test stack --test reuse --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: All ownership IR controls including CAF, scalar and matched-result owners
        if: ${{ !cancelled() }}
        run: cargo test --lib rc::tests
