name: Returned buffer phase measurements

on:
  workflow_call:
    inputs:
      source_tag:
        description: Immutable timing tag for this exact source
        type: string
        required: true

permissions:
  contents: read

jobs:
  phases:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            c_arch: x86-64
            rust_cpu: x86-64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            c_arch: armv8-a
            rust_cpu: generic
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.2-noble
    timeout-minutes: 120
    env:
      CC: gcc
      CXX: g++
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
    steps:
      - name: Native compilers and measurement tools
        run: apt-get update && apt-get install -y git gcc g++ python3 binutils curl libssl-dev pkg-config time llvm
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        env:
          RUSTUP_INIT_SKIP_SUDO_CHECK: 'yes'
        with:
          toolchain: 1.99.1
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-swift-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Exact native source and tag
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$SOURCE_TAG")" = "$GITHUB_SHA"
          swiftc --version
          cat /etc/os-release
      - name: Build current fwp
        shell: bash
        run: |
          set -euo pipefail
          mkdir buffer-time-setup
          cargo fetch --locked 2>&1 | tee buffer-time-setup/fetch.log
          cargo build --locked --offline --bin fwp 2>&1 | tee buffer-time-setup/build.log
      - name: Verify phase outputs, clocks and measurement reader before pilot
        run: |
          python3 scripts/test-returned-buffer-phases.py
          python3 scripts/check-measurement-clocks.py --cc gcc
          python3 scripts/check-returned-buffer-phases.py --cc gcc --ar ar --rustc rustc --swiftc swiftc \
            --compiler target/debug/fwp --source "$GITHUB_SHA" --arch "${{ matrix.arch }}" \
            --c-arch "${{ matrix.c_arch }}" --rust-cpu "${{ matrix.rust_cpu }}" \
            --target "${{ matrix.arch }}-unknown-linux-gnu" --output buffer-time-checks
      - name: C-only pilot and two complete paired sessions
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: >-
          python3 scripts/measure-returned-buffers.py collect
          --compiler target/debug/fwp --source "$GITHUB_SHA" --tag "$SOURCE_TAG"
          --arch "${{ matrix.arch }}" --cc gcc --ar ar --rustc rustc --swiftc swiftc
          --c-arch "${{ matrix.c_arch }}" --rust-cpu "${{ matrix.rust_cpu }}"
          --target "${{ matrix.arch }}-unknown-linux-gnu" --time /usr/bin/time
          --objdump llvm-objdump --readelf readelf --output buffer-time-evidence
      - name: Reconstruct every result from raw observations
        run: >-
          python3 scripts/measure-returned-buffers.py audit --input buffer-time-evidence
          --source "$GITHUB_SHA" --arch "${{ matrix.arch }}"
      - name: Retain completed and failed observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: returned-buffer-time-${{ matrix.arch }}
          path: |
            buffer-time-setup/
            buffer-time-checks/
            buffer-time-evidence/
          if-no-files-found: error
