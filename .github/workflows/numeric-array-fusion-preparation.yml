name: Numeric Array fusion preparation
on:
  push:
    branches: [ownership-evidence-numeric-array-fusion]
jobs:
  numeric_fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARRAY_FUSION_ARTIFACTS: array-fusion-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and validate compiler changes
        run: |
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          cargo test --test ad_tape_ownership --test ad_tape_scopes --test autodiff_capacity_bounds --test numeric_array_fusion --test old_reclamation --test retain_unwind_ownership --test unboxed_worker_locals
      - name: Compare semantics and complete allocation controls
        run: python3 scripts/measure-numeric-array-fusion.py
      - name: Export formatted source
        if: always()
        run: |
          mkdir -p array-fusion-evidence/source
          cp src/fuse.rs src/cgen.rs src/numerics.rs tests/autodiff_capacity_bounds.rs tests/numeric_array_fusion.rs array-fusion-evidence/source/
          cp runtime/fwp_rt_kernel.c array-fusion-evidence/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-array-fusion-evidence
          path: |
            array-fusion-evidence/source/*.rs
            array-fusion-evidence/*.json
            array-fusion-evidence/*.c
            array-fusion-evidence/*.asm
