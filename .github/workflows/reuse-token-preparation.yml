name: Focused compiler reuse token preparation

on:
  push:
    branches: [ownership-evidence-reuse-tokens]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --test gc -- -D warnings
      - name: Reuse token transfer and exceptional cleanup
        if: ${{ !cancelled() }}
        run: cargo test --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: Full-size raw interpreter tail oracle on the runner
        if: ${{ !cancelled() }}
        run: |
          cargo build --release
          uname -m
          lscpu
          cat Cargo.toml
          rustc --version
          cc --version
          cat > /tmp/fwp-tail-token-full.fwp <<'FWP'
          Box = | Empty | Box I64
          down : Box -> Box ! {Error[String]}
          rec down = match
              Empty -> Empty
              Box _ -> if (lt 0) (const "negative" | fail) (if (eq 0) Box (sub 1 | Box | down))
          main = Box 100000 | attempt down | echo
          FWP
          /usr/bin/time -v env FWP_NO_OPT=1 target/release/fwp run --interp /tmp/fwp-tail-token-full.fwp > /tmp/fwp-tail-token-full.out
          test "$(cat /tmp/fwp-tail-token-full.out)" = 'Ok (Box 0)'
