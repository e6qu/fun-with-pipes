name: Focused callback map unwind preparation

on:
  push:
    branches: [ownership-evidence-map-unwind]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_KEEP_FAILED_FIXTURES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - name: Native debug compiler wrapper
        run: |
          cat > "$RUNNER_TEMP/fwp-debug-cc" <<'SH'
          #!/bin/sh
          exec cc -g "$@"
          SH
          chmod +x "$RUNNER_TEMP/fwp-debug-cc"
          echo "CC=$RUNNER_TEMP/fwp-debug-cc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test map_unwind_ownership --test runtime_call_ownership --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --test gc -- -D warnings
      - name: Partial map results, scratch buffers and exceptional cleanup
        if: ${{ !cancelled() }}
        run: cargo test --test map_unwind_ownership --test runtime_call_ownership --test compiler_call_liveness --test reuse_token_ownership --test unwind_cleanup --test task_ownership --test old_reclamation --test ownership --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: Diagnose preserved map fixture on failure
        if: ${{ failure() }}
        run: |
          command -v gdb || (sudo apt-get update && sudo apt-get install -y gdb)
          for exe in /tmp/fwp-map-unwind-*-callbacks/callbacks; do
            test -f "$exe" || continue
            gdb --batch -ex 'set env FWP_GC_STRESS 1' -ex 'set env FWP_GC_VERIFY 1' -ex 'set env FWP_REUSE_VERIFY 0' -ex run -ex bt -ex 'info locals' "$exe"
          done
