name: Focused gRPC client connection and context lifetimes

on:
  push:
    branches: [ownership-evidence-grpc-client]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for merged preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Handoff links, immutable anchors and commit subjects
        run: python3 scripts/check-roadmap.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: cargo clippy --test grpc_client_requests --test grpc_client_failure_text --test grpc_client_receive --test grpc_connect_cleanup --test grpc_connect_startup --test grpc_context_restore --test grpc_peer_completion --test grpc_status_cleanup --test grpc_force_cleanup --test grpc_send_cleanup --test old_reclamation --test ownership --test gc -- -D warnings
      - name: Client retries and failures, connection rollback and restored dynamic contexts
        if: ${{ !cancelled() }}
        run: cargo test --test grpc_client_requests --test grpc_client_failure_text --test grpc_client_receive --test grpc_connect_cleanup --test grpc_connect_startup --test grpc_context_restore --test grpc_peer_completion --test grpc_status_cleanup --test grpc_force_cleanup --test grpc_send_cleanup --test old_reclamation --test ownership --no-fail-fast
      - name: Actual tracing churn and bounded live memory
        if: ${{ !cancelled() }}
        run: cargo test --test gc long_loop_runs_in_bounded_memory -- --exact --nocapture
      - name: Primitive boundary consistency
        if: ${{ !cancelled() }}
        run: cargo test --lib ownership::tests::declared_collection_and_text_boundaries_have_consistent_contracts -- --exact
      - name: Resource metadata and fusion order
        if: ${{ !cancelled() }}
        run: cargo test --lib resource::tests -- --nocapture
