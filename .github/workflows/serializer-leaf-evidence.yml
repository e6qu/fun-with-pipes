name: Serializer leaf ownership preflight
on:
  push:
    branches: [ownership-evidence-serializer-leaves]
permissions:
  contents: read
jobs:
  codecs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FWP_CODEC_ARTIFACTS: ${{ runner.temp }}/codecs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Format and verify focused contracts
        run: |
          rustfmt --edition 2021 src/ownership.rs tests/serializer_leaf_ownership.rs
          cargo test --lib
          cargo test --test serializer_leaf_ownership --test leaf_ownership --no-fail-fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-leaves-${{ matrix.runner }}
          path: ${{ runner.temp }}/codecs
