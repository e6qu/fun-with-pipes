name: Tape layout measurements
on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      evidence_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  descent_peers:
    name: descent_peers (${{ matrix.session }}, ${{ matrix.runner }})
    if: inputs.phase == 'time'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-latest]
        session: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CC: gcc
      CARGO_BUILD_JOBS: 2
      REFERENCE_KIND: tape-records
      COMPARISON_PROTOCOL: tape-records
      COMPARISON: tape-records
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Verify focused correctness and matching compiler sources
        env:
          GH_TOKEN: ${{ github.token }}
          SAFETY_RUN: ${{ inputs.evidence_run }}
        run: |
          [[ "$SAFETY_RUN" =~ ^[0-9]+$ ]]
          mkdir numeric-analysis-safety
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SAFETY_RUN" > numeric-analysis-safety/run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SAFETY_RUN/jobs?per_page=100" > numeric-analysis-safety/jobs.json
          python3 scripts/check-measurement-safety.py --comparison "$COMPARISON_PROTOCOL" --input numeric-analysis-safety --checkout "$PWD"
          python3 "scripts/test-$REFERENCE_KIND-reference.py"
          python3 scripts/test-numeric-input-analysis.py
      - name: Qualify the native host before building
        env:
          EXPECTED_CPU: ${{ matrix.runner == 'ubuntu-latest' && 'AMD EPYC 7763 64-Core Processor' || 'Neoverse-N2' }}
          EXPECTED_MACHINE: ${{ matrix.runner == 'ubuntu-latest' && 'x86_64' || 'aarch64' }}
          EXPECTED_CC: ${{ matrix.runner == 'ubuntu-latest' && 'gcc (Ubuntu 15.2.0-16ubuntu1) 15.2.0' || 'gcc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0' }}
        run: |
          cpus=(--cpu "$EXPECTED_CPU")
          if [[ "$EXPECTED_MACHINE" == x86_64 ]]; then
            cpus+=(--cpu 'AMD EPYC 9V74 80-Core Processor' --cpu 'AMD EPYC 9V45 96-Core Processor')
          fi
          python3 scripts/descent-baselines.py "${cpus[@]}" --machine "$EXPECTED_MACHINE" \
            --cc gcc --rustc rustc --c-version "$EXPECTED_CC" \
            --rust-version 'rustc 1.99.1 (58cf8f9c3 2026-10-13)' \
            --source "$GITHUB_SHA" --processors 4 --output descent-host.json
      - name: Preserve host qualification, including rejected hosts
        if: ${{ always() && hashFiles('descent-host.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: descent-host-${{ matrix.runner }}-${{ matrix.session }}
          path: descent-host.json
          if-no-files-found: error
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - id: compiler
        run: cargo build --locked --release --bin fwp
      - name: Check explicit derivative source formatting
        run: |
          target/release/fwp fmt --check tests/fixtures/descent_explicit.fwp tests/fixtures/descent_packed.fwp
          rustfmt --edition 2021 --check tests/fixtures/descent_explicit.rs
      - name: Process scheduling and host qualification controls
        run: python3 scripts/test-descent-schedule.py
      - name: Numerical measurement requirement controls
        run: python3 scripts/test-descent-budgets.py
      - name: Derivative phase-observer controls
        run: python3 scripts/test-descent-phases.py --cc gcc
      - name: Build the same-source reference with only the selected transformation disabled
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/$REFERENCE_KIND-reference" "$GITHUB_SHA"
          python3 "scripts/prepare-$REFERENCE_KIND-reference.py" --checkout "$RUNNER_TEMP/$REFERENCE_KIND-reference" --output "$REFERENCE_KIND-reference"
          cargo build --locked --release --bin fwp --manifest-path "$RUNNER_TEMP/$REFERENCE_KIND-reference/Cargo.toml" --target-dir "$RUNNER_TEMP/$REFERENCE_KIND-reference-target"
          cp "$RUNNER_TEMP/$REFERENCE_KIND-reference-target/release/fwp" "$REFERENCE_KIND-reference/fwp"
          python3 "scripts/prepare-$REFERENCE_KIND-reference.py" --verify "$RUNNER_TEMP/$REFERENCE_KIND-reference" --output "$REFERENCE_KIND-reference"
      - name: Compare the candidate with its same-source reference
        run: >-
          python3 scripts/measure-descent-peers.py --compiler target/release/fwp --comparison ${{ env.COMPARISON_PROTOCOL }}
          --reference-compiler ${{ env.REFERENCE_KIND }}-reference/fwp
          --reference-manifest ${{ env.REFERENCE_KIND }}-reference/manifest.json
          --cc gcc --rustc rustc --c-arch "${{ matrix.runner == 'ubuntu-latest' && 'x86-64' || 'armv8-a' }}"
          --objdump objdump --nm nm --time /usr/bin/time
          --case 3:0:7:32768 --case 3:1:7:512 --case 3:199:7:32 --case 3:1999:7:4 --case 33:199:7:32 --case 129:199:7:8
          --warmups 2 --samples 98 --order-seed 20261029 --timeout 180
          --phase-warmups 2 --phase-samples 12 --session "${{ matrix.session }}"
          --host "${{ matrix.runner }}" --qualification descent-host.json --output descent-peers-evidence
      - name: Preserve the matching correctness prerequisite
        if: ${{ always() && hashFiles('numeric-analysis-safety/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPARISON_PROTOCOL }}-safety-${{ matrix.runner }}-${{ matrix.session }}
          path: numeric-analysis-safety/
          if-no-files-found: error
      - name: Preserve reference source and compiler identities
        if: ${{ always() && hashFiles('tape-records-reference/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REFERENCE_KIND }}-reference-${{ matrix.runner }}-${{ matrix.session }}
          path: ${{ env.REFERENCE_KIND }}-reference/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('descent-peers-evidence/**') != '' }}
        with:
          name: descent-peers-${{ matrix.runner }}-${{ matrix.session }}
          path: descent-peers-evidence/
          if-no-files-found: error
  numeric_input_analysis:
    if: inputs.phase == 'analysis'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: gcc
      CARGO_BUILD_JOBS: 2
      REFERENCE_KIND: tape-records
      COMPARISON_PROTOCOL: tape-records
      COMPARISON: tape-records
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      FWP_LTO: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Verify focused correctness and matching compiler sources
        env:
          GH_TOKEN: ${{ github.token }}
          SAFETY_RUN: ${{ inputs.evidence_run }}
        run: |
          [[ "$SAFETY_RUN" =~ ^[0-9]+$ ]]
          mkdir numeric-analysis-safety
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SAFETY_RUN" > numeric-analysis-safety/run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SAFETY_RUN/jobs?per_page=100" > numeric-analysis-safety/jobs.json
          python3 scripts/check-measurement-safety.py --comparison "$COMPARISON" --input numeric-analysis-safety --checkout "$PWD"
          python3 "scripts/test-$REFERENCE_KIND-reference.py"
          python3 scripts/test-numeric-input-analysis.py
      - name: Qualify tape-records compiler timing host
        env:
          EXPECTED_MACHINE: ${{ matrix.runner == 'ubuntu-latest' && 'x86_64' || 'aarch64' }}
          EXPECTED_CC: ${{ matrix.runner == 'ubuntu-latest' && 'gcc (Ubuntu 15.2.0-16ubuntu1) 15.2.0' || 'gcc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0' }}
        run: |
          cpus=(--cpu Neoverse-N2)
          if [[ "$EXPECTED_MACHINE" == x86_64 ]]; then
            cpus=(--cpu 'AMD EPYC 7763 64-Core Processor' --cpu 'AMD EPYC 9V74 80-Core Processor' --cpu 'AMD EPYC 9V45 96-Core Processor')
          fi
          python3 scripts/descent-baselines.py "${cpus[@]}" --machine "$EXPECTED_MACHINE" \
            --cc gcc --rustc rustc --c-version "$EXPECTED_CC" \
            --rust-version 'rustc 1.99.1 (58cf8f9c3 2026-10-13)' \
            --source "$GITHUB_SHA" --processors 4 --output compiler-cost-host.json
      - name: Preserve compiler timing host qualification
        if: ${{ always() && hashFiles('compiler-cost-host.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: tape-records-analysis-host-${{ runner.arch }}
          path: compiler-cost-host.json
          if-no-files-found: error
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build candidate at production settings
        run: |
          cargo fetch --locked
          CARGO_NET_OFFLINE=true cargo build --locked --bin fwp
      - name: Build and verify the selected same-source reference
        run: |
          reference_checkout="$RUNNER_TEMP/numeric-input-reference"
          reference_target="$RUNNER_TEMP/numeric-input-reference-target"
          git worktree add --detach "$reference_checkout" "$GITHUB_SHA"
          python3 "scripts/prepare-$REFERENCE_KIND-reference.py" --checkout "$reference_checkout" --output numeric-analysis-reference
          CARGO_TARGET_DIR="$reference_target" CARGO_NET_OFFLINE=true cargo build --locked --bin fwp --manifest-path "$reference_checkout/Cargo.toml"
          cp "$reference_target/debug/fwp" numeric-analysis-reference/fwp
          python3 "scripts/prepare-$REFERENCE_KIND-reference.py" --verify "$reference_checkout" --output numeric-analysis-reference
      - name: Measure balanced compiler commands and peak memory
        run: >-
          python3 scripts/measure-numeric-input-analysis.py --comparison "$COMPARISON" --compiler target/debug/fwp
          --reference numeric-analysis-reference/fwp --reference-manifest numeric-analysis-reference/manifest.json
          --time /usr/bin/time --machine ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
          --source "$GITHUB_SHA" --timeout 180 --output numeric-analysis
      - name: Preserve complete measurements and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tape-records-analysis-${{ runner.arch }}
          path: |
            numeric-analysis/
            numeric-analysis-reference/
            numeric-analysis-safety/
          if-no-files-found: error
