    if: inputs.suite == 'macos-shards'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: OpenSSL
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Coverage and failure propagation
        run: python3 scripts/test-native-test-runner.py
      - name: Real Cargo test artifacts and concurrent execution
        run: |
          python3 - <<'PYTHON'
          import importlib.util, json, os, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('shards', 'scripts/run-native-tests.py')
          shards = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(shards)
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))
          selected = ['compiler_options', 'stdlib_doc', 'native_sockets']
          command = ['cargo', 'test', '--no-run', '--message-format=json', '--lib', '--bins']
          for target in selected:
              command += ['--test', target]
          built = subprocess.run(command, stdout=subprocess.PIPE, text=True)
          if built.returncode:
              print(built.stdout)
              built.check_returncode()
          executables = shards.test_executables(built.stdout, metadata, 'regular', selected)
          raise SystemExit(shards.run_tests(executables, ['--skip', 'golden_programs_under_gc_stress'],
                                           Path(os.environ['RUNNER_TEMP']) / 'macos-shard-probe', 1800))
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-shard-probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/macos-shard-probe/
          if-no-files-found: warn
