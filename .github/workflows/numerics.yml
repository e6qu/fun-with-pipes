name: Numerical and ownership evidence
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evidence suite
        type: choice
        options: [language, shutdown, repl-terminal, numerical, bundle, wide, windows, windows-full, portability, wasm, wasi-arc, wasm-hosts, iteration, autodiff, performance, syntax, library, library-results, collection-build, collection-report, large-map, map-replay, map-borrow, map-storage, artifact-paths, library-unload, solvers, array-borrow, record-moves, matrix-alias, precision, console, paths, filesystem, fields, processes, ad-metadata, ad-layout, ad-sites, mapped-arrays, mapped-array-costs, mapped-array-repeat, zip-maps, zip-windows, zip-map-costs, zip-map-repeat, integer-output-report, hash-alias, hash, hash-windows, hash-costs, hash-report, hash-specialization-repeat, hash-repeat, vectors, vector-costs, vector-repeat, byte-decoders, decoders, kernels, sockets, udp, tcp, tcp-windows, service-values, service-values-linux, context-storage, context-owners, stream-storage, stream-owners, stream-clients, stream-repeat, connection-repeat, sender-repeat, server-repeat, server-arc, http-clients, http-server-memory, entry-checks, function-captures, fixed-functions, server-checks, server-entries, server-recheck, compiler-cache, chain-cleanup, macos-shards, ci-profile]
        default: numerical
      native_runner:
        description: Native host for an early probe; all uses the suite's full matrix
        type: choice
        options: [all, ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
        default: all
      server_entry_part:
        description: Server-entry jobs; checks runs entry and API jobs, all adds memory measurements
        type: choice
        options: [all, checks, api, stdio, http-rest, http-mcp]
        default: all
      source_revision:
        description: Full source commit for profiling, evidence audits or server rechecks
        type: string
      evidence_run:
        description: Completed test or measurement run consumed by the selected suite
        type: string
      costs_run:
        description: Completed hash-costs run for the hash evidence audit
        type: string
      baseline_run:
        description: Earlier matching cost run for paired revision comparison
        type: string
jobs:
  hash_alias:
    if: inputs.suite == 'hash-alias'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Record source and build the probe compiler
        run: |
          mkdir -p hash-alias-evidence
          git rev-parse HEAD > hash-alias-evidence/source.txt
          cargo build --bin fwp
      - name: Compare GCC and Clang aliasing behavior
        run: python3 scripts/probe-hash-aliasing.py --fwp target/debug/fwp --cc gcc --cc clang --optimization=-O1 --optimization=-O2 --optimization=-O3 --output hash-alias-evidence
      - name: Complete hash ownership tests with GCC
        if: ${{ !cancelled() }}
        env:
          CC: gcc
        run: cargo test --no-fail-fast --test hash_ownership --test static_constants --test closure_ownership --test map_set_ownership --test field_moves
      - name: Complete hash ownership tests with Clang
        if: ${{ !cancelled() }}
        env:
          CC: clang
        run: cargo test --no-fail-fast --test hash_ownership --test static_constants --test closure_ownership --test map_set_ownership --test field_moves
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hash-alias-${{ matrix.runner }}
          path: hash-alias-evidence/
          if-no-files-found: error
  shutdown:
    if: inputs.suite == 'shutdown'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Target timeout, child termination and continued coverage
        if: ${{ !cancelled() }}
        run: python3 scripts/test-native-test-runner.py
      - name: Shutdown, network stalls and complete allocation ledgers
        env:
          FWP_CONSTANT_ARTIFACTS: static-constant-evidence
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYTHON'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess

          spec = importlib.util.spec_from_file_location('native_tests', 'scripts/run-native-tests.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          targets = ['static_constants', 'grpc_receive_cleanup', 'arc_tasks', 'exec_protocol_ownership',
                     'service_scope_ownership', 'collection_construction', 'map_set_ownership',
                     'cached_map_borrows', 'arc_corpus', 'arc_execution', 'udp_ownership',
                     'autodiff_nested', 'foreign_callback_ownership', 'autodiff_precision',
                     'native_sockets', 'autodiff_checkpoint', 'library_unload',
                     'opencl_lifetime', 'softfloat_core']
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))
          command = ['cargo', 'test', '--no-run', '--message-format=json']
          for target in targets:
              command += ['--test', target]
          built = subprocess.run(command, stdout=subprocess.PIPE, text=True)
          if built.returncode:
              print(built.stdout)
              built.check_returncode()
          executables = runner.test_executables(built.stdout, metadata, 'gc', targets)
          raise SystemExit(runner.run_tests(executables, [],
                           Path(os.environ['RUNNER_TEMP']) / 'shutdown-tests', 900))
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shutdown-tests-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/shutdown-tests/
            static-constant-evidence/
          if-no-files-found: warn
  repl_terminal:
    if: inputs.suite == 'repl-terminal'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_runner == 'all' && '["ubuntu-latest","ubuntu-24.04-arm","macos-15","macos-15-intel"]' || format('["{0}"]', inputs.native_runner)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Require a POSIX terminal host
        shell: bash
        run: test "$RUNNER_OS" != Windows
      - run: cargo build --bin fwp
      - name: Completion, history, multiline entry and execution interruption
        env:
          FWP_TEST_BIN: ${{ github.workspace }}/target/debug/fwp
        run: python3 -W error::ResourceWarning -m unittest discover -s sdk/python/tests -p test_repl_terminal.py -v
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: repl-terminal-${{ matrix.runner }}
          path: target/debug/fwp
          if-no-files-found: ignore
  language:
    if: inputs.suite == 'language'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y llvm gcc-aarch64-linux-gnu
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test --no-fail-fast --test tail_recursion --test arc_execution --test record_conversion_ownership --test variant_alias_ownership --test wide_workers --test task_ownership --test task_handle_ownership --test reuse_token_ownership --test preempt --test infix --test repl --test debugger --test scalar_math --test float_math --test cached_map_borrows --test caf_ownership --test inline_caf_ownership --test stdlib_doc -- --nocapture
      - if: ${{ !cancelled() }}
        name: Tail recursion code and memory evidence
        env:
          PYTHONPATH: sdk/python
        run: python3 scripts/measure-tail-recursion.py --fwp target/debug/fwp --cc cc --objdump llvm-objdump --output tail-recursion-evidence --iterations 1000000 --samples 8 --timeout 180
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tail-recursion-evidence
          path: tail-recursion-evidence/
          if-no-files-found: warn
      - if: ${{ !cancelled() }}
        name: Python debugger, notebook and C/machine-code comparisons
        env:
          PYTHONPATH: sdk/python
          FWP_TEST_BIN: ${{ github.workspace }}/target/debug/fwp
          CC: cc
          FWP_OBJDUMP: llvm-objdump
          FWP_CROSS_CC: aarch64-linux-gnu-gcc
        run: python3 -W error::ResourceWarning -m unittest discover -s sdk/python/tests -v
      - if: ${{ !cancelled() }}
        name: Real notebook browser
        env:
          FWP_TEST_BIN: ${{ github.workspace }}/target/debug/fwp
        run: |
          python3 -m venv "$RUNNER_TEMP/fwp-tools-env"
          "$RUNNER_TEMP/fwp-tools-env/bin/python" -m pip install ./sdk/python -r sdk/python/browser/requirements.txt
          "$RUNNER_TEMP/fwp-tools-env/bin/python" -m playwright install --with-deps chromium
          "$FWP_TEST_BIN" notebook --python "$RUNNER_TEMP/fwp-tools-env/bin/python" --help
          "$RUNNER_TEMP/fwp-tools-env/bin/python" sdk/python/browser/check_notebook.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: notebook-browser
          path: notebook-evidence/
          if-no-files-found: error
  artifact_paths:
    if: inputs.suite == 'artifact-paths'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_LIST_AP_ARTIFACTS: artifact-path-evidence/list
      FWP_TYPED_STATE_ARTIFACTS: artifact-path-evidence/state
      FWP_AD_ARTIFACTS: artifact-path-evidence/ad-unwind
      FWP_AD_WORKSPACE_ARTIFACTS: artifact-path-evidence/ad-workspace
      FWP_AD_SCOPE_ARTIFACTS: artifact-path-evidence/ad
      FWP_CODEC_ARTIFACTS: artifact-path-evidence/codecs
      FWP_ARRAY_SIZE_ARTIFACTS: artifact-path-evidence/arrays
      FWP_DEVICE_BOUNDS_ARTIFACTS: artifact-path-evidence/device
      FWP_GC_DIAGNOSTICS_ARTIFACTS: artifact-path-evidence/gc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native Windows toolchain
        shell: pwsh
        id: windows_toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-windows.ps1
      - uses: actions/cache/restore@v6
        id: artifact_tls_cache
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Native Windows TLS dependencies
        shell: pwsh
        run: ./scripts/setup-windows-tls.ps1
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && env.FWP_WINDOWS_DEPS_READY == '1' && steps.artifact_tls_cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Record source and tools
        shell: bash
        run: |
          mkdir -p artifact-path-evidence
          git rev-parse HEAD > artifact-path-evidence/source.txt
          rustc --version > artifact-path-evidence/rustc.txt
          clang --version > artifact-path-evidence/clang.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --lib --bin fwp --test list_applicative_ownership --test typed_state_ownership --test ad_tape_scopes --test serializer_leaf_ownership --test ad_tape_ownership --test autodiff_workspace --test blocked_matrix --test worker_preparation_ownership --test array_size_limits --test device_bounds --test gc -- -D warnings
      - name: Native ownership checks with artifact writing enabled
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') }}
        run: cargo test --no-fail-fast --test list_applicative_ownership --test typed_state_ownership --test ad_tape_scopes --test serializer_leaf_ownership --test ad_tape_ownership --test autodiff_workspace --test blocked_matrix --test worker_preparation_ownership -- --nocapture
      - name: Array bounds through generated native programs
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') }}
        run: cargo test --test array_size_limits array_size_limits_agree_with_raw_interpreter_and_generic_wrappers -- --exact --nocapture
      - name: Device validation without a GPU or sanitizer toolchain
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') }}
        run: cargo test --test device_bounds device_output_limits_preserve_kernel_validation_order -- --exact --nocapture
      - name: Retain the actual executable after a snapshot mismatch
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') }}
        run: cargo test --test gc gc_failure_artifacts_retain_the_native_executable -- --exact --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifact-paths-${{ matrix.runner }}
          path: artifact-path-evidence/
          if-no-files-found: error
  large_map:
    if: inputs.suite == 'large-map'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_runner == 'all' && '["ubuntu-latest","ubuntu-24.04-arm"]' || format('["{0}"]', inputs.native_runner)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: cc
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Require a native Linux measurement host
        run: test "${{ runner.os }}" = Linux
      - uses: dtolnay/rust-toolchain@stable
      - name: Native compiler dependencies and binary inspection tools
        run: sudo apt-get update && sudo apt-get install -y libssl-dev binutils
      - name: Build the measured compiler
        run: cargo build --release --bin fwp
      - name: Compare complete map work with construction fusion on and off
        run: python3 scripts/measure-large-map.py --output large-map-evidence
      - name: Locate variable large-map construction costs
        run: python3 scripts/measure-map-phases.py --input large-map-evidence --output large-map-evidence/phases
      - name: Compare joined map buffers with the original layout
        run: python3 scripts/measure-map-storage.py --input large-map-evidence --output large-map-evidence/storage
      - name: Attribute construction and query costs for both layouts
        run: python3 scripts/measure-map-storage-phases.py --input large-map-evidence/storage --output large-map-evidence/storage-phases
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: large-map-${{ matrix.runner }}
          path: large-map-evidence/
          if-no-files-found: error
  map_replay:
    if: inputs.suite == 'map-replay'
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      EVIDENCE_HEAD: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
      - name: Check rejection of changed or incomplete evidence
        run: python3 scripts/test-map-replay.py
      - name: Repeat verified binaries without compiler or native builds
        run: python3 scripts/replay-map-storage.py --run "$EVIDENCE_RUN" --source "$EVIDENCE_HEAD" --output map-replay-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: map-replay-${{ matrix.sample }}
          path: map-replay-evidence/
          if-no-files-found: error
  map_borrow:
    if: inputs.suite == 'map-borrow'
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, sample: 1}
          - {runner: ubuntu-latest, sample: 2}
          - {runner: ubuntu-latest, sample: 3}
          - {runner: ubuntu-latest, sample: 4}
          - {runner: ubuntu-24.04-arm, sample: 1}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: cc
      CARGO_BUILD_JOBS: 2
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      EVIDENCE_HEAD: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify the measured compiler
        run: cargo test --no-fail-fast --lib rc::tests::cached_map_borrow && cargo test --no-fail-fast --test cached_map_borrows --test caf_ownership --test inline_caf_ownership
      - name: Measure compiler-proved cached-map borrowing against saved owned reads
        run: python3 scripts/measure-map-borrow.py --compiler target/debug/fwp --run "$EVIDENCE_RUN" --source "$EVIDENCE_HEAD" --host "${{ matrix.runner }}" --output map-borrow-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: map-borrow-${{ matrix.runner }}-${{ matrix.sample }}
          path: map-borrow-evidence/
          if-no-files-found: error
  collection_report:
    if: inputs.suite == 'collection-report'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      EVIDENCE_HEAD: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
      - name: Install binary inspection tools
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Check complete-target evidence validation
        run: python3 scripts/test-collection-evidence.py
      - name: Audit all hosts and inspect their saved binaries
        run: python3 scripts/summarize-collection-build.py --run "$EVIDENCE_RUN" --head "$EVIDENCE_HEAD" --artifacts collection-report/artifacts --llvm-bin /usr/bin --output collection-report/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: collection-build-report
          path: |
            collection-report/report.json
            collection-report/artifacts/*.json
            collection-report/artifacts/*.log
            collection-report/artifacts/**/*.disassembly.txt
            collection-report/artifacts/**/*.symbols.txt
          if-no-files-found: error
  integer_output_report:
    if: inputs.suite == 'integer-output-report'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      EVIDENCE_HEAD: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
      - name: Install binary inspection tools
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Reject incomplete output evidence
        run: python3 scripts/test-integer-output-evidence.py
      - name: Audit six native hosts and their actual binaries
        run: python3 scripts/summarize-integer-output.py --run "$EVIDENCE_RUN" --head "$EVIDENCE_HEAD" --artifacts integer-output-report/artifacts --llvm-bin /usr/bin --output integer-output-report/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-output-report
          path: |
            integer-output-report/report.json
            integer-output-report/artifacts/*.json
            integer-output-report/artifacts/*.log
            integer-output-report/artifacts/**/*.disassembly.txt
            integer-output-report/artifacts/**/*.symbols.txt
          if-no-files-found: error
  hash_specialization_repeat:
    if: inputs.suite == 'hash-specialization-repeat'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      EVIDENCE_HEAD: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
      - name: Check binary verification and sample balance
        run: python3 scripts/test-hash-evidence.py
      - name: Repeat the same hash binaries with C and Rust
        run: python3 scripts/repeat-hash-specialization.py --run "$EVIDENCE_RUN" --source "$EVIDENCE_HEAD" --host "${{ matrix.runner }}" --samples 24 --warmups 2 --output hash-repeat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hash-specialization-repeat-${{ matrix.runner }}
          path: |
            hash-repeat/report.json
            hash-repeat/source-run.json
          if-no-files-found: error
  hash_report:
    if: inputs.suite == 'hash-report'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      COSTS_RUN: ${{ inputs.costs_run }}
      EVIDENCE_HEAD: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
      - name: Install binary inspection tools
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Check incomplete evidence rejection
        run: python3 scripts/test-hash-evidence.py
      - name: Audit native hash checks, measurements and saved binaries
        run: python3 scripts/summarize-hashing.py --tests-run "$EVIDENCE_RUN" --costs-run "$COSTS_RUN" --head "$EVIDENCE_HEAD" --artifacts hash-report/artifacts --llvm-bin /usr/bin --output hash-report/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hash-report
          path: |
            hash-report/report.json
            hash-report/artifacts/*.json
            hash-report/artifacts/*.log
            hash-report/artifacts/**/*.disassembly.txt
            hash-report/artifacts/**/*.symbols.txt
          if-no-files-found: error
  collection_build:
    if: inputs.suite == 'collection-build'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_runner == 'all' && '["ubuntu-latest","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2025","windows-11-arm"]' || format('["{0}"]', inputs.native_runner)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_COLLECTION_ARTIFACTS: collection-build-evidence/checks
      FWP_MAP_FAILURE_ARTIFACTS: collection-build-evidence/sets
      FWP_CONSTANT_ARTIFACTS: collection-build-evidence/constants
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        id: windows_toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-windows.ps1
      - name: Record source and tools
        shell: bash
        run: |
          mkdir -p collection-build-evidence
          git rev-parse HEAD > collection-build-evidence/source.txt
          rustc --version > collection-build-evidence/rustc.txt
          clang --version > collection-build-evidence/clang.txt
