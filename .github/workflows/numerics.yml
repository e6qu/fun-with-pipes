name: Numerical and ownership evidence
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evidence suite
        type: choice
        options: [numerical, bundle, wide, windows, windows-full, portability, wasm, wasi-arc, iteration, autodiff, performance, syntax, library, library-unload, solvers, array-borrow, record-moves, matrix-alias, precision, console, paths, filesystem, fields, processes, ad-metadata, ad-layout, ad-sites, mapped-arrays, mapped-array-costs, mapped-array-repeat, zip-maps, zip-windows, zip-map-costs, zip-map-repeat, hash, hash-windows, hash-costs, hash-repeat, vectors, vector-costs, vector-repeat, decoders, kernels, sockets]
        default: numerical
      evidence_run:
        description: Completed evidence run to use for generated-code comparisons
        type: string
      baseline_run:
        description: Earlier matching cost run for paired revision comparison
        type: string
jobs:
  paths:
    if: inputs.suite == 'sockets' || inputs.suite == 'kernels' || inputs.suite == 'decoders' || inputs.suite == 'vectors' || inputs.suite == 'paths' || inputs.suite == 'filesystem' || inputs.suite == 'fields' || inputs.suite == 'processes' || inputs.suite == 'mapped-arrays' || inputs.suite == 'zip-maps' || inputs.suite == 'zip-windows' || inputs.suite == 'hash' || inputs.suite == 'hash-windows'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON((inputs.suite == 'zip-windows' || inputs.suite == 'hash-windows') && '["windows-2025","windows-11-arm"]' || '["ubuntu-latest","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - uses: actions/cache/restore@v4
        id: decoder_tls_cache
        if: runner.os == 'Windows' && inputs.suite == 'decoders'
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Native Windows decoder peer dependencies
        if: runner.os == 'Windows' && inputs.suite == 'decoders'
        shell: pwsh
        run: ./scripts/setup-windows-tls.ps1
      - uses: actions/cache/save@v4
        if: runner.os == 'Windows' && inputs.suite == 'decoders' && env.FWP_WINDOWS_DEPS_READY == '1' && steps.decoder_tls_cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Filesystem ownership
        if: inputs.suite == 'paths' || inputs.suite == 'filesystem'
        run: cargo test --no-fail-fast --test path_validation --test io_error_ownership --test system_snapshots --test file_values --test text_file_tools --test stdlib_doc --test file_construction_ownership --test file_inline_path --test file_storage_disposal
      - name: Retrieve immutable CPU kernel baseline
        if: inputs.suite == 'kernels' || inputs.suite == 'decoders'
        run: |
          git fetch --no-tags --depth=1 origin 21a621c699d11a84c05f955935dc95dcfb8adbf2
          git show 21a621c699d11a84c05f955935dc95dcfb8adbf2:runtime/fwp_rt_kernel.c > kernel-baseline.c
      - name: Socket scratch and DNS ownership
        if: inputs.suite == 'sockets'
        env:
          FWP_DECODER_ARTIFACTS: decoder-evidence
        run: cargo test --no-fail-fast --test native_sockets --test dns_ownership
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'sockets'
        with:
          name: sockets-${{ matrix.runner }}
          path: decoder-evidence/
          if-no-files-found: ignore
      - name: CPU kernel ownership
        if: inputs.suite == 'kernels' || inputs.suite == 'decoders'
        env:
          FWP_KERNEL_ARTIFACTS: kernel-evidence
          FWP_KERNEL_BASELINE: kernel-baseline.c
        run: cargo test --no-fail-fast --test cpu_kernel_ownership --test stdlib_doc
      - name: CPU kernel size validation order
        if: inputs.suite == 'kernels' || inputs.suite == 'decoders'
        run: cargo test --test device_bounds device_output_limits_preserve_kernel_validation_order -- --exact
      - name: Interpreter final reduction block
        if: inputs.suite == 'kernels' || inputs.suite == 'decoders'
        run: cargo test --lib numerics::kernel_boundary_tests::final_reduction_block_does_not_wrap_at_the_address_limit -- --exact
      - name: CPU kernel sanitized size and cleanup controls
        if: (inputs.suite == 'kernels' || inputs.suite == 'decoders') && runner.os != 'Windows'
        run: cargo test --test device_bounds device_allocations_are_bounded_and_cleanup_controls_detect_omissions -- --exact
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.suite == 'kernels' || inputs.suite == 'decoders')
        with:
          name: kernels-${{ matrix.runner }}
          path: kernel-evidence/
          if-no-files-found: ignore
      - name: Value decoder ownership and partial-failure cleanup
        if: inputs.suite == 'decoders'
        env:
          FWP_DECODER_ARTIFACTS: decoder-evidence
        run: cargo test --no-fail-fast --test metrics_ownership --test library_unload --test byte_decoder_ownership --test ternary_ownership --test dns_ownership --test native_sockets --test text_decoder_ownership --test web --test std_tests --test arc_execution --test stdlib_doc
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'decoders'
        with:
          name: decoders-${{ matrix.runner }}
          path: decoder-evidence/
          if-no-files-found: ignore
      - name: Vector ownership, boxed lanes and failure cleanup
        if: inputs.suite == 'vectors'
        env:
          FWP_VECTOR_ARTIFACTS: vector-evidence
        run: |
          cargo test --lib ownership::tests
          cargo test --lib fuse::tests
          cargo test --no-fail-fast --test vector_ownership --test array_element_ownership --test arc_execution
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'vectors'
        with:
          name: vectors-${{ matrix.runner }}
          path: vector-evidence/
          if-no-files-found: ignore
      - name: Streaming hash ownership and canonical protocol
        if: inputs.suite == 'hash' || inputs.suite == 'hash-windows'
        env:
          FWP_HASH_ARTIFACTS: hash-evidence
        run: |
          cargo test --lib rc::tests
          cargo test --lib escape::tests
          cargo test --lib ownership::tests
          cargo test --no-fail-fast --test range_array --test hash_ownership --test protocol --test arc_execution
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.suite == 'hash' || inputs.suite == 'hash-windows')
        with:
          name: hash-${{ matrix.runner }}
          path: hash-evidence/
          if-no-files-found: ignore
      - name: Field movement and resource lifetime regressions
        if: inputs.suite == 'fields'
        run: cargo test --no-fail-fast --test clock_ownership --test directory_report --test working_directory --test arc_execution --test field_moves --test boxed_field_moves --test field_context_ownership --test unboxed_worker_locals --test record_conversion_ownership --test resource_frames --test resource_frame_fields --test resource_frame_variants --test resource_match_context --test borrowed_callbacks --test general_record_update_ownership
      - name: Numeric mapped-array construction and neighboring ownership
        if: inputs.suite == 'mapped-arrays'
        run: cargo test --no-fail-fast --test mapped_array_construction --test numeric_array_fusion --test map_ownership --test array_element_ownership --test arc_execution --test ad_tape_scopes
      - name: Numeric zip/map construction and partial-result cleanup
        if: inputs.suite == 'zip-maps' || inputs.suite == 'zip-windows'
        run: cargo test --no-fail-fast --test zip_map_fusion --test unzip_cleanup --test list_construction_cleanup --test zip_ownership --test zip_unwind_ownership --test fold_unwind_ownership --test map_unwind_ownership --test selection_unwind_ownership --test list_structure_ownership --test list_generation_ownership --test state_sequence_ownership --test mapped_array_construction --test numeric_array_fusion --test map_ownership --test arc_execution --test ad_tape_scopes
      - name: Interpreter console state on Windows
        if: inputs.suite == 'processes' && runner.os == 'Windows'
        run: cargo test --lib sys::tty::tests::native_console -- --exact
      - name: Child-process ownership and failure cleanup
        if: inputs.suite == 'processes'
        env:
          FWP_PROCESS_ARTIFACTS: process-evidence
        run: cargo test --no-fail-fast --test process_ownership --test terminal_ownership --test console_ownership --test windows_runtime --test windows_static_memory --test cli --test stdlib_doc
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'processes'
        with:
          name: process-${{ matrix.runner }}
          path: process-evidence/
          if-no-files-found: ignore
  list_counts_wasi:
    if: inputs.suite == 'zip-maps'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_REQUIRE_WASI_COUNTS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: WASI toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld wabt wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32
      - name: Positive 64-bit counts on the actual 32-bit target
        run: cargo test --test wasm positive_64_bit_counts_saturate_before_wasi_allocation_and_slice_bounds -- --exact
  array_borrow:
    if: inputs.suite == 'array-borrow'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CC: clang
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Download verified emitted numerical programs
        run: |
          test -n "$EVIDENCE_RUN"
          gh run download "$EVIDENCE_RUN" --name "solver-${{ matrix.runner }}" --dir solver-input
      - name: Compare cached and per-element array reads
        run: python3 scripts/measure-array-borrow.py --input solver-input/arrays/performance --output array-borrow-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: array-borrow-${{ matrix.runner }}
          path: array-borrow-evidence/
  record_moves:
    if: inputs.suite == 'record-moves'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CC: clang
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Download verified emitted numerical programs
        run: |
          test -n "$EVIDENCE_RUN"
          gh run download "$EVIDENCE_RUN" --name "solver-${{ matrix.runner }}" --dir solver-input
      - name: Compare field moves with retained record fields
        run: python3 scripts/measure-record-moves.py --input solver-input/arrays/performance --output record-move-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: record-moves-${{ matrix.runner }}
          path: record-move-evidence/
  matrix_alias:
    if: inputs.suite == 'matrix-alias'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CC: clang
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Download verified emitted numerical programs
        run: |
          test -n "$EVIDENCE_RUN"
          gh run download "$EVIDENCE_RUN" --name "solver-${{ matrix.runner }}" --dir solver-input
      - name: Compare explicit fresh output with the local matrix pointer
        run: python3 scripts/measure-matrix-alias.py --input solver-input/arrays/performance --output matrix-alias-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matrix-alias-${{ matrix.runner }}
          path: matrix-alias-evidence/
  console:
    if: inputs.suite == 'console'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: console-evidence
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --test console_ownership --test arc_execution --test arc_corpus --test text_ownership --test cli_ownership
      - name: Primitive ownership inventory
        run: python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output console-evidence/inventory.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-${{ matrix.runner }}
          path: console-evidence/
      - name: Preserve compiler crash reports
        uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'macOS'
        with:
          name: compiler-crashes-console-${{ matrix.runner }}
          path: ~/Library/Logs/DiagnosticReports/fwp*
          if-no-files-found: ignore
  precision:
    if: inputs.suite == 'precision'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_AD_PRECISION_ARTIFACTS: precision-evidence
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --test autodiff_precision --test autodiff_nested --test autodiff_checkpoint --test ad_tape_scopes --test ad_tape_ownership --test autodiff_workspace --test autodiff_capacity_bounds --test autodiff_library --test float_formats --test stdlib_doc
      - name: Record profile environment
        run: |
          uname -a > precision-evidence/environment.txt
          rustc -Vv >> precision-evidence/environment.txt
          clang --version >> precision-evidence/environment.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: precision-${{ matrix.runner }}
          path: precision-evidence/
      - name: Preserve compiler crash reports
        uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'macOS'
        with:
          name: compiler-crashes-precision-${{ matrix.runner }}
          path: ~/Library/Logs/DiagnosticReports/fwp*
          if-no-files-found: ignore
  solvers:
    if: inputs.suite == 'solvers'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARRAY_FUSION_ARTIFACTS: solver-evidence/arrays
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --test linalg_ownership --test array_loop_borrows --test numeric_array_fusion --test loop_unwind_ownership --test arc_execution --test blocked_matrix --test transpose_ownership
      - name: Primitive ownership inventory
        run: python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output solver-evidence/inventory.json
      - run: cargo build --release --bin fwp
      - name: Compare numerical kernels against C and Rust
        run: python3 scripts/measure-numerical-kernels.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: solver-${{ matrix.runner }}
          path: solver-evidence/
      - name: Preserve compiler crash reports
        uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'macOS'
        with:
          name: compiler-crashes-solvers-${{ matrix.runner }}
          path: ~/Library/Logs/DiagnosticReports/fwp*
          if-no-files-found: ignore
  library_unload:
    if: inputs.suite == 'library-unload'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Native Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - run: cargo fmt --all -- --check
      - run: cargo test --test library_unload -- --nocapture
  library:
    if: inputs.suite == 'library'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARRAY_FUSION_ARTIFACTS: library-evidence/arrays
      FWP_ARC_ARTIFACTS: library-evidence/arc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --test arc_library --test arc_execution --test arc_tasks --test channel_queue_ownership --test channel_cycle_ownership --test transpose_ownership --test native_allocator --test library_input_ownership --test library_result_ownership --test library_resources --test library_unload --test autodiff_library --test ffi --test blocked_matrix --test wide_workers --test loop_unwind_ownership
      - name: Primitive ownership inventory
        run: python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output library-evidence/inventory.json
      - run: cargo build --release --bin fwp
      - name: Compare tracing and checked ARC against C and Rust
        run: python3 scripts/measure-numerical-kernels.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: library-${{ matrix.runner }}
          path: library-evidence/
      - name: Preserve compiler crash reports
        uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'macOS'
        with:
          name: compiler-crashes-library-${{ matrix.runner }}
          path: ~/Library/Logs/DiagnosticReports/fwp*
          if-no-files-found: ignore

  syntax:
    if: inputs.suite == 'syntax'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --test infix --test fmt --test golden_parse --test golden_check --test numeric_array_fusion --test arc_execution --test loop_unwind_ownership
  performance:
    if: inputs.suite == 'performance'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARRAY_FUSION_ARTIFACTS: performance-evidence/arrays
      FWP_ARC_ARTIFACTS: performance-evidence/arc
      FWP_AD_WORKSPACE_ARTIFACTS: performance-evidence/workspaces
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Focused semantics and ownership controls
        run: cargo test --no-fail-fast --test infix --test numeric_array_fusion --test blocked_matrix --test arc_execution --test autodiff_workspace --test autodiff_capacity_bounds --test borrowed_callbacks --test pipe_ownership
      - name: Build measurement compiler
        id: compiler
        if: ${{ !cancelled() }}
        run: cargo build --release --bin fwp
      - name: Numerical C and Rust comparison
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/measure-numerical-kernels.py
      - name: Reproduce derivative metadata timings
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-metadata.py --output performance-evidence/metadata
      - name: Complete-program C and Rust comparison
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --release --test bench -- --ignored --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ matrix.runner }}
          path: |
            performance-evidence/
            target/bench.md
  mapped_array_repeat:
    if: inputs.suite == 'mapped-array-repeat' || inputs.suite == 'zip-map-repeat' || inputs.suite == 'hash-repeat' || inputs.suite == 'vector-repeat'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CC: clang
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Download verified before and after revisions
        if: inputs.suite == 'hash-repeat' || inputs.suite == 'vector-repeat'
        run: |
          test -n "$EVIDENCE_RUN"
          test -n "$BASELINE_RUN"
          gh run download "$BASELINE_RUN" --name "${{ inputs.suite == 'hash-repeat' && 'hash-costs' || 'vector-costs' }}-${{ matrix.runner }}" --dir revision-before
          gh run download "$EVIDENCE_RUN" --name "${{ inputs.suite == 'hash-repeat' && 'hash-costs' || 'vector-costs' }}-${{ matrix.runner }}" --dir revision-after
      - name: Repeat revisions beside C and Rust
        if: inputs.suite == 'hash-repeat' || inputs.suite == 'vector-repeat'
        run: python3 scripts/repeat-revision-comparison.py --workload ${{ inputs.suite == 'hash-repeat' && 'hash' || 'vectors' }} --before revision-before --after revision-after --output comparison-repeat
      - name: Download verified comparison binaries
        if: inputs.suite != 'hash-repeat' && inputs.suite != 'vector-repeat'
        run: |
          test -n "$EVIDENCE_RUN"
          gh run download "$EVIDENCE_RUN" --name "${{ inputs.suite == 'zip-map-repeat' && 'zip-map-costs' || 'mapped-array-costs' }}-${{ matrix.runner }}" --dir comparison-input
      - name: Compare elapsed time, child CPU time and normal collection
        if: inputs.suite != 'hash-repeat' && inputs.suite != 'vector-repeat'
        run: python3 scripts/repeat-native-comparison.py --input comparison-input --output comparison-repeat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.suite }}-${{ matrix.runner }}
          path: comparison-repeat/
  ad_metadata:
    if: inputs.suite == 'ad-metadata' || inputs.suite == 'ad-layout' || inputs.suite == 'ad-sites' || inputs.suite == 'mapped-array-costs' || inputs.suite == 'zip-map-costs' || inputs.suite == 'hash-costs' || inputs.suite == 'vector-costs'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin fwp
      - name: Compare equivalent F64 lane calculations in fwp C and Rust
        if: inputs.suite == 'vector-costs'
        run: python3 scripts/measure-vector-lanes.py --output metadata-evidence
      - name: Compare equivalent hashing in fwp C and Rust
        if: inputs.suite == 'hash-costs'
        run: python3 scripts/measure-hashing.py --output metadata-evidence
      - name: Compare numeric zip/map allocation and timing costs
        if: inputs.suite == 'zip-map-costs'
        run: python3 scripts/measure-zip-maps.py --output metadata-evidence
      - name: Compare numeric mapped-array costs
        if: inputs.suite == 'mapped-array-costs'
        run: python3 scripts/measure-mapped-arrays.py --output metadata-evidence
      - name: Attribute derivative allocations to native call sites
        if: inputs.suite == 'ad-sites'
        run: python3 scripts/measure-ad-allocation-sites.py --output metadata-evidence
      - name: Repeat paired metadata costs with sustained derivatives
        if: inputs.suite != 'ad-sites' && inputs.suite != 'mapped-array-costs' && inputs.suite != 'zip-map-costs' && inputs.suite != 'hash-costs' && inputs.suite != 'vector-costs'
        run: python3 scripts/measure-ad-metadata.py --comparison "${{ inputs.suite == 'ad-layout' && 'interleaved' || 'separate' }}" --output metadata-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.suite }}-${{ matrix.runner }}
          path: metadata-evidence/
  autodiff:
    if: inputs.suite == 'autodiff'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_AD_WORKSPACE_ARTIFACTS: autodiff-evidence
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo test --no-fail-fast --lib --test autodiff_checkpoint --test autodiff_nested --test ad_tape_scopes --test ad_tape_ownership --test autodiff_workspace --test autodiff_capacity_bounds --test autodiff_library --test pipe_ownership
      - run: cargo build --release --bin fwp
        id: checkpoint_compiler
        if: ${{ !cancelled() }}
      - name: Checkpoint recomputation and storage measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-checkpoint.py --output autodiff-evidence/checkpoint
      - name: Numeric backward prefix storage and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-prefix.py --output autodiff-evidence/prefix
      - name: Operation-only tape storage and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-operations.py --output autodiff-evidence/operations
      - name: Registry growth allocation and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-registry.py --comparison growth --output autodiff-evidence/registry
      - name: Registry search work and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-registry.py --comparison search --output autodiff-evidence/search
      - name: Paired metadata allocation and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-metadata.py --comparison separate --output autodiff-evidence/metadata
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autodiff-${{ matrix.runner }}
          path: autodiff-evidence/
  numeric_fusion:
    if: inputs.suite == 'numerical'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: arc-evidence
      FWP_ARRAY_FUSION_ARTIFACTS: array-fusion-evidence
      FWP_AD_WORKSPACE_ARTIFACTS: array-fusion-evidence/workspaces
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: WebAssembly toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld wabt wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32
      - name: OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Format and validate compiler changes
        id: compiler
        run: |
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Checked ARC eligibility, reclamation and native binaries
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --test arc_execution --test arc_corpus
      - name: Numerical, autodiff and loop ownership regressions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test ad_tape_ownership --test ad_tape_scopes --test autodiff_capacity_bounds --test autodiff_workspace --test autodiff_library --test blocked_matrix --test numeric_array_fusion --test old_reclamation --test retain_unwind_ownership --test unboxed_worker_locals --test loop_ownership --test loop_unwind_ownership --test loop_preparation_ownership --test field_context_ownership
      - name: Preserve original stack allocation and variant ownership controls
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test stack --test stack_ownership --test stack_match_ownership --test variant_alias_ownership --test variant_conversion_ownership
      - name: Preserve original in-place allocation thresholds
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --test reuse unique_arrays_are_written_in_place
      - name: Escaping closures and exceptional resource ownership
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test closure_ownership --test closure_cleanup --test unwind_cleanup
      - name: Actual wasm32 autodiff capacity controls
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && runner.os == 'Linux' }}
        env:
          FWP_REQUIRE_WASI_COUNTS: 1
        run: cargo test --test wasm autodiff_capacity_bounds_precede_actual_wasm32_allocation
      - name: Retain permanent allocation evidence
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/summarize-numeric-array-fusion.py
      - name: Equivalent C and Rust numerical workloads
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/measure-numerical-kernels.py
      - name: Export formatted source
        if: always()
        run: |
          mkdir -p array-fusion-evidence/source
          cp src/opt.rs src/arc.rs src/ir.rs src/main.rs src/lib.rs tests/arc_execution.rs tests/arc_corpus.rs tests/loop_ownership.rs src/rc.rs src/fuse.rs src/cgen.rs src/numerics.rs src/mono.rs src/ownership.rs tests/autodiff_capacity_bounds.rs tests/numeric_array_fusion.rs tests/autodiff_workspace.rs tests/autodiff_library.rs tests/blocked_matrix.rs tests/wasm.rs tests/ad_tape_ownership.rs tests/ad_tape_scopes.rs array-fusion-evidence/source/
          cp runtime/fwp_rt_prims.c runtime/fwp_rt_gc.c runtime/fwp_rt_kernel.c array-fusion-evidence/source/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numeric-array-fusion-evidence-${{ matrix.runner }}
          path: |
            array-fusion-evidence/source/*.rs
            array-fusion-evidence/source/*.c
            array-fusion-evidence/*.json
            array-fusion-evidence/*.c
            array-fusion-evidence/*.asm
            array-fusion-evidence/workspaces/*.json
            array-fusion-evidence/performance/*.json
            array-fusion-evidence/performance/*.txt
            array-fusion-evidence/performance/*.c
            array-fusion-evidence/performance/*.asm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arc-evidence-${{ matrix.runner }}
          path: arc-evidence/

  bundle_preflight:
    if: inputs.suite == 'bundle' || inputs.suite == 'wide'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: bundle-evidence/arc
      FWP_AD_WORKSPACE_ARTIFACTS: bundle-evidence/workspaces
      FWP_AD_SCOPE_ARTIFACTS: bundle-evidence/scopes
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: inputs.suite == 'bundle' && runner.os == 'Linux'
        with:
          node-version: 24
      - name: Linux toolchains
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld libssl-dev wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Format and compiler checks
        id: compiler
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Focused bundle regressions
        if: inputs.suite == 'bundle'
        run: cargo test --no-fail-fast --lib --test protocol --test wide_workers --test decoder_partial --test arc_extensions --test arc_execution --test iteration_consumers --test iterator_fusion --test http2_body_roots --test list_generation_ownership --test ad_tape_scopes --test ad_tape_ownership --test autodiff_workspace
      - name: Wide scalar and record ownership regressions
        if: inputs.suite == 'wide'
        run: cargo test --no-fail-fast --lib --test native_allocator --test wide_workers --test unboxed_worker_locals --test iterator_fusion --test arc_tasks --test arc_execution --test foreign_callback_ownership --test exec_invocation_ownership --test exec_protocol_ownership --test cli_ownership --test cli --test exec --test pipe_ownership --test native_sockets --test tls --test connect_cleanup --test tls_listener_ownership --test grpc_server_ownership --test library_resources
      - name: Actual WASI golden programs
        if: inputs.suite == 'bundle' && runner.os == 'Linux'
        env:
          FWP_REQUIRE_WASI_GOLDENS: 1
        run: cargo test --test wasm golden_programs_under_wasi
      - name: GCC conservative-root omission control
        if: inputs.suite == 'bundle' && runner.os == 'Linux'
        run: CC=gcc cargo test --test http2_body_roots
      - name: Build evidence compiler
        id: release
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo build --release --bin fwp
      - name: Iterator allocation and instruction evidence
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 scripts/measure-iteration.py --output bundle-evidence/iteration
      - name: Wide worker allocation and instruction evidence
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 scripts/measure-wide.py --output bundle-evidence/wide
      - name: Ownership inventory
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output bundle-evidence/inventory.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-preflight-${{ matrix.runner }}
          path: bundle-evidence/

  windows_probe:
    if: inputs.suite == 'windows' || inputs.suite == 'windows-full'
    uses: ./.github/workflows/windows.yml
    with:
      full: ${{ inputs.suite == 'windows-full' }}

  portability:
    if: inputs.suite == 'portability' || inputs.suite == 'iteration'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Compiler checks
        id: compiler
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Child signal status in both engines
        run: cargo test --test cli child_signal_status_matches_the_shell_in_both_engines -- --exact
      - name: Exact language formats and protocol migration
        run: cargo test --no-fail-fast --test float_formats --test float_linking --test protocol --test wide_workers --test array_unwind_ownership
      - name: Ownership and foreign boundary regressions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test arc_execution --test arc_tasks --test ffi --test foreign_callback_ownership --test tls --test softfloat_core --test float_math --test native_allocator --test file_runtime_ownership --test file_inline_path --test file_storage_disposal --test array_size_limits
      - name: Iterator forcing, ownership and specialization
        run: cargo test --test iterator_fusion --test iteration_consumers --test float_literals
      - name: Iterator allocation and instruction evidence
        if: inputs.suite == 'iteration'
        run: |
          cargo build --release --bin fwp
          python3 scripts/measure-iteration.py --output iteration-evidence
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'iteration'
        with:
          name: iteration-evidence-${{ matrix.runner }}
          path: iteration-evidence/

  wasm_ownership:
    if: inputs.suite == 'wasm' || inputs.suite == 'wasi-arc'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_REQUIRE_WASM_RESOURCE_COUNTS: 1
      FWP_REQUIRE_WASI_ARC: 1
      FWP_WASI_ARC_ARTIFACTS: wasi-arc-evidence
      FWP_REQUIRE_WASI_GOLDENS: 1
      FWP_REQUIRE_FLOAT_WASI: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: WASI toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld wabt wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32
      - name: Checked WASI ownership and physical storage
        if: inputs.suite == 'wasi-arc'
        run: cargo test --no-fail-fast --test wasm_arc --test arc_execution --test wasm_resource_counts
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'wasi-arc'
        with:
          name: wasi-arc-${{ matrix.runner }}
          path: wasi-arc-evidence/
          if-no-files-found: ignore
      - name: WebAssembly compiler and exact Rust arithmetic
        if: inputs.suite == 'wasm'
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node tests/wasm/wasi-run.mjs
        run: |
          cargo test --lib --target wasm32-wasip1 softfloat:: -- --test-threads=1
      - name: Physical reclamation and resource controls
        if: inputs.suite == 'wasm'
        run: cargo test --test wasm_resource_counts --test softfloat_core --test float_math --test array_size_limits
      - name: Actual WASI semantic agreement
        if: ${{ !cancelled() && inputs.suite == 'wasm' }}
        run: cargo test --no-fail-fast --test wasm --test browser --test exec_invocation_ownership
