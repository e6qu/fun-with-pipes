  server_checks:
    if: inputs.suite == 'server-checks' || inputs.suite == 'server-entries' || inputs.suite == 'server-recheck'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_runner != 'all' && format('["{0}"]', inputs.native_runner) || '["ubuntu-latest","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2025","windows-11-arm"]') }}
        part: ${{ fromJSON(inputs.suite == 'server-recheck' && '["checks","api"]' || inputs.suite == 'server-entries' && (inputs.server_entry_part == 'checks' && '["checks","api"]' || inputs.server_entry_part != 'all' && format('["{0}"]', inputs.server_entry_part) || '["checks","api","stdio","http-rest","http-mcp"]') || '["checks"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_UDP_ARTIFACTS: server-check-evidence/udp
      FWP_SERVER_ENTRY_ARTIFACTS: server-check-evidence/entries
      FWP_ENTRY_INTERFACE: ${{ matrix.part == 'http-rest' && 'rest' || matrix.part == 'http-mcp' && 'mcp' || '' }}
    steps:
      - name: Require the exact source commit for a recheck
        if: inputs.suite == 'server-recheck'
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_revision }}
        run: '[[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.suite == 'server-recheck' && inputs.source_revision || github.sha }}
      - name: Verify recheck source
        if: inputs.suite == 'server-recheck'
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          echo "verified-source=$REQUESTED_SOURCE workflow=$GITHUB_SHA part=${{ matrix.part }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        id: windows_toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-windows.ps1
      - uses: actions/cache/restore@v6
        id: server_tls_cache
        if: runner.os == 'Windows'
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Native Windows TLS dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-tls.ps1
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && runner.os == 'Windows' && env.FWP_WINDOWS_DEPS_READY == '1' && steps.server_tls_cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Record source and toolchains
        shell: bash
        run: |
          mkdir -p server-check-evidence
          git rev-parse HEAD > server-check-evidence/revision.txt
          printf '%s\n' "$GITHUB_SHA" > server-check-evidence/workflow-revision.txt
          rustc -Vv > server-check-evidence/rust.txt
          printf '%s\n' '${{ runner.os }} ${{ runner.arch }}' > server-check-evidence/platform.txt
          printf '%s\n' '${{ github.run_id }}' > server-check-evidence/run.txt
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          evidence = Path('server-check-evidence')
          compiler = os.environ['CC']
          (evidence / 'c.txt').write_text(compiler + '\n' + subprocess.check_output([compiler, '--version'], text=True))
          system = platform.system()
          if system == 'Linux':
              cpu = Path('/proc/cpuinfo').read_text()
          elif system == 'Darwin':
              cpu = subprocess.check_output(['sysctl', 'machdep.cpu.brand_string', 'hw.model', 'hw.ncpu'], text=True)
          else:
              assert system == 'Windows', system
              cpu = subprocess.check_output(['powershell', '-NoProfile', '-Command', 'Get-CimInstance Win32_Processor | Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json'], text=True)
          (evidence / 'cpu.txt').write_text(platform.platform() + '\n' + platform.machine() + '\n' + cpu)
          files = sorted(p for directory in ['src', 'lib', 'runtime'] for p in Path(directory).rglob('*') if p.is_file())
          files += [Path(name) for name in ['tests/server_entry_ownership.rs', 'tests/fixtures/server_entries.fwp', 'tests/fixtures/server_entry_client.fwp', 'tests/support/client_allocations.rs', 'tests/support/process_memory.rs', 'scripts/summarize-server-entries.py', '.github/workflows/numerics.yml']]
          Path('server-check-evidence/source-sha256.json').write_text(json.dumps({p.as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, indent=2) + '\n')
          PY
      - run: cargo fmt --all -- --check
        if: matrix.part == 'checks'
      - run: cargo clippy --all-targets -- -D warnings
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && matrix.part == 'checks' }}
      - name: Accepted connections, UDP cleanup and readiness failures
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'server-checks' }}
        run: cargo test --no-fail-fast --test grpc_server_connections --test udp_ownership --test native_sockets -- --nocapture
      - name: Generated entry results and ownership restrictions
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite != 'server-checks' && matrix.part == 'checks' }}
        run: cargo test --no-fail-fast --test server_entry_ownership --test arc_execution -- --nocapture
      - name: Exact JSON and YAML numeric parsing
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite != 'server-checks' && matrix.part == 'checks' }}
        shell: bash
        run: |
          status=0
          cargo test --lib json::tests -- --nocapture || status=1
          cargo test --lib yaml::tests -- --nocapture || status=1
          cargo test --test rest openapi_balanced_integer_limits_are_exact -- --exact --nocapture || status=1
          exit "$status"
      - name: REST API, authentication and multipart forms with checked ARC
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite != 'server-checks' && matrix.part == 'api' }}
        run: cargo test --test rest checked_arc_rest_preserves_api_authentication_and_form_results -- --exact --nocapture
      - name: OpenAPI generated clients through JSON, forms and CSV
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite != 'server-checks' && matrix.part == 'api' }}
        run: cargo test --test rest forms_client_round_trip -- --exact --nocapture
      - name: Swagger generated clients through JSON, forms and CSV
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite != 'server-checks' && matrix.part == 'api' }}
        run: cargo test --test rest swagger_documents -- --exact --nocapture
      - name: Repeated MCP standard-input requests and non-freeing control
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'server-entries' && matrix.part == 'stdio' }}
        run: cargo test --test server_entry_ownership mcp_stdio_releases_repeated_requests_without_collection -- --ignored --exact --nocapture
      - name: HTTP entry results, retained storage and process memory
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'server-entries' && startsWith(matrix.part, 'http-') }}
        run: cargo test --test server_entry_ownership generated_http_entries_release_requests_and_bound_process_memory -- --ignored --exact --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.suite }}-${{ matrix.runner }}-${{ matrix.part }}
          path: server-check-evidence/
          if-no-files-found: error
