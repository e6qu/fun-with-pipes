name: Numerical and ownership evidence
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evidence suite
        type: choice
        options: [numerical, bundle, wide, windows, windows-full, portability, wasm, iteration, autodiff, performance]
        default: numerical
jobs:
  performance:
    if: inputs.suite == 'performance'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARRAY_FUSION_ARTIFACTS: performance-evidence/arrays
      FWP_ARC_ARTIFACTS: performance-evidence/arc
      FWP_AD_WORKSPACE_ARTIFACTS: performance-evidence/workspaces
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Focused semantics and ownership controls
        run: cargo test --no-fail-fast --test numeric_array_fusion --test blocked_matrix --test arc_execution --test autodiff_workspace --test autodiff_capacity_bounds --test borrowed_callbacks --test pipe_ownership
      - name: Build measurement compiler
        id: compiler
        if: ${{ !cancelled() }}
        run: cargo build --release --bin fwp
      - name: Numerical C and Rust comparison
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/measure-numerical-kernels.py
      - name: Reproduce derivative metadata timings
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-metadata.py --output performance-evidence/metadata
      - name: Complete-program C and Rust comparison
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --release --test bench -- --ignored --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ matrix.runner }}
          path: |
            performance-evidence/
            target/bench.md
  autodiff:
    if: inputs.suite == 'autodiff'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_AD_WORKSPACE_ARTIFACTS: autodiff-evidence
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo test --no-fail-fast --lib --test autodiff_checkpoint --test autodiff_nested --test ad_tape_scopes --test ad_tape_ownership --test autodiff_workspace --test autodiff_capacity_bounds --test autodiff_library --test pipe_ownership
      - run: cargo build --release --bin fwp
        id: checkpoint_compiler
        if: ${{ !cancelled() }}
      - name: Checkpoint recomputation and storage measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-checkpoint.py --output autodiff-evidence/checkpoint
      - name: Numeric backward prefix storage and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-prefix.py --output autodiff-evidence/prefix
      - name: Operation-only tape storage and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-operations.py --output autodiff-evidence/operations
      - name: Registry growth allocation and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-registry.py --comparison growth --output autodiff-evidence/registry
      - name: Registry search work and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-registry.py --comparison search --output autodiff-evidence/search
      - name: Paired metadata allocation and binary measurements
        if: ${{ !cancelled() && steps.checkpoint_compiler.outcome == 'success' }}
        run: python3 scripts/measure-ad-metadata.py --output autodiff-evidence/metadata
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autodiff-${{ matrix.runner }}
          path: autodiff-evidence/
  numeric_fusion:
    if: inputs.suite == 'numerical'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: arc-evidence
      FWP_ARRAY_FUSION_ARTIFACTS: array-fusion-evidence
      FWP_AD_WORKSPACE_ARTIFACTS: array-fusion-evidence/workspaces
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: WebAssembly toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32
      - name: OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Format and validate compiler changes
        id: compiler
        run: |
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Checked ARC eligibility, reclamation and native binaries
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --test arc_execution --test arc_corpus
      - name: Numerical, autodiff and loop ownership regressions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test ad_tape_ownership --test ad_tape_scopes --test autodiff_capacity_bounds --test autodiff_workspace --test autodiff_library --test blocked_matrix --test numeric_array_fusion --test old_reclamation --test retain_unwind_ownership --test unboxed_worker_locals --test loop_ownership --test loop_unwind_ownership --test loop_preparation_ownership --test field_context_ownership
      - name: Preserve original stack allocation and variant ownership controls
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test stack --test stack_ownership --test stack_match_ownership --test variant_alias_ownership --test variant_conversion_ownership
      - name: Preserve original in-place allocation thresholds
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --test reuse unique_arrays_are_written_in_place
      - name: Escaping closures and exceptional resource ownership
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test closure_ownership --test closure_cleanup --test unwind_cleanup
      - name: Actual wasm32 autodiff capacity controls
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && runner.os == 'Linux' }}
        env:
          FWP_REQUIRE_WASI_COUNTS: 1
        run: cargo test --test wasm autodiff_capacity_bounds_precede_actual_wasm32_allocation
      - name: Retain permanent allocation evidence
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/summarize-numeric-array-fusion.py
      - name: Equivalent C and Rust numerical workloads
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: python3 scripts/measure-numerical-kernels.py
      - name: Export formatted source
        if: always()
        run: |
          mkdir -p array-fusion-evidence/source
          cp src/opt.rs src/arc.rs src/ir.rs src/main.rs src/lib.rs tests/arc_execution.rs tests/arc_corpus.rs tests/loop_ownership.rs src/rc.rs src/fuse.rs src/cgen.rs src/numerics.rs src/mono.rs src/ownership.rs tests/autodiff_capacity_bounds.rs tests/numeric_array_fusion.rs tests/autodiff_workspace.rs tests/autodiff_library.rs tests/blocked_matrix.rs tests/wasm.rs tests/ad_tape_ownership.rs tests/ad_tape_scopes.rs array-fusion-evidence/source/
          cp runtime/fwp_rt_prims.c runtime/fwp_rt_gc.c runtime/fwp_rt_kernel.c array-fusion-evidence/source/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numeric-array-fusion-evidence-${{ matrix.runner }}
          path: |
            array-fusion-evidence/source/*.rs
            array-fusion-evidence/source/*.c
            array-fusion-evidence/*.json
            array-fusion-evidence/*.c
            array-fusion-evidence/*.asm
            array-fusion-evidence/workspaces/*.json
            array-fusion-evidence/performance/*.json
            array-fusion-evidence/performance/*.txt
            array-fusion-evidence/performance/*.c
            array-fusion-evidence/performance/*.asm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arc-evidence-${{ matrix.runner }}
          path: arc-evidence/

  bundle_preflight:
    if: inputs.suite == 'bundle' || inputs.suite == 'wide'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: bundle-evidence/arc
      FWP_AD_WORKSPACE_ARTIFACTS: bundle-evidence/workspaces
      FWP_AD_SCOPE_ARTIFACTS: bundle-evidence/scopes
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: inputs.suite == 'bundle' && runner.os == 'Linux'
        with:
          node-version: 24
      - name: Linux toolchains
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld libssl-dev wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Format and compiler checks
        id: compiler
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Focused bundle regressions
        if: inputs.suite == 'bundle'
        run: cargo test --no-fail-fast --lib --test protocol --test wide_workers --test decoder_partial --test arc_extensions --test arc_execution --test iteration_consumers --test iterator_fusion --test http2_body_roots --test list_generation_ownership --test ad_tape_scopes --test ad_tape_ownership --test autodiff_workspace
      - name: Wide scalar and record ownership regressions
        if: inputs.suite == 'wide'
        run: cargo test --no-fail-fast --lib --test native_allocator --test wide_workers --test unboxed_worker_locals --test iterator_fusion --test arc_tasks --test arc_execution --test foreign_callback_ownership --test exec_invocation_ownership --test exec_protocol_ownership --test cli_ownership --test cli --test exec --test pipe_ownership --test native_sockets --test tls --test connect_cleanup --test tls_listener_ownership --test grpc_server_ownership --test library_resources
      - name: Actual WASI golden programs
        if: inputs.suite == 'bundle' && runner.os == 'Linux'
        env:
          FWP_REQUIRE_WASI_GOLDENS: 1
        run: cargo test --test wasm golden_programs_under_wasi
      - name: GCC conservative-root omission control
        if: inputs.suite == 'bundle' && runner.os == 'Linux'
        run: CC=gcc cargo test --test http2_body_roots
      - name: Build evidence compiler
        id: release
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo build --release --bin fwp
      - name: Iterator allocation and instruction evidence
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 scripts/measure-iteration.py --output bundle-evidence/iteration
      - name: Wide worker allocation and instruction evidence
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 scripts/measure-wide.py --output bundle-evidence/wide
      - name: Ownership inventory
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output bundle-evidence/inventory.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-preflight-${{ matrix.runner }}
          path: bundle-evidence/

  windows_probe:
    if: inputs.suite == 'windows' || inputs.suite == 'windows-full'
    uses: ./.github/workflows/windows.yml
    with:
      full: ${{ inputs.suite == 'windows-full' }}

  portability:
    if: inputs.suite == 'portability' || inputs.suite == 'iteration'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Compiler checks
        id: compiler
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Child signal status in both engines
        run: cargo test --test cli child_signal_status_matches_the_shell_in_both_engines -- --exact
      - name: Exact language formats and protocol migration
        run: cargo test --no-fail-fast --test float_formats --test float_linking --test protocol --test wide_workers --test array_unwind_ownership
      - name: Ownership and foreign boundary regressions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --no-fail-fast --test arc_execution --test arc_tasks --test ffi --test foreign_callback_ownership --test tls --test softfloat_core --test float_math --test native_allocator --test file_runtime_ownership --test file_inline_path --test file_storage_disposal --test array_size_limits
      - name: Iterator forcing, ownership and specialization
        run: cargo test --test iterator_fusion --test iteration_consumers --test float_literals
      - name: Iterator allocation and instruction evidence
        if: inputs.suite == 'iteration'
        run: |
          cargo build --release --bin fwp
          python3 scripts/measure-iteration.py --output iteration-evidence
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'iteration'
        with:
          name: iteration-evidence-${{ matrix.runner }}
          path: iteration-evidence/

  wasm_ownership:
    if: inputs.suite == 'wasm'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_REQUIRE_WASM_RESOURCE_COUNTS: 1
      FWP_REQUIRE_WASI_GOLDENS: 1
      FWP_REQUIRE_FLOAT_WASI: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: WASI toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32
      - name: WebAssembly compiler and exact Rust arithmetic
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node tests/wasm/wasi-run.mjs
        run: |
          cargo test --lib --target wasm32-wasip1 softfloat:: -- --test-threads=1
      - name: Physical reclamation and resource controls
        run: cargo test --test wasm_resource_counts --test softfloat_core --test float_math --test array_size_limits
      - name: Actual WASI semantic agreement
        if: ${{ !cancelled() }}
        run: cargo test --no-fail-fast --test wasm --test browser --test exec_invocation_ownership
