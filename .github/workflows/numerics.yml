  paths:
    name: ${{ matrix.part == 'ownership' && format('HTTP ownership ({0})', matrix.runner) || matrix.part == 'comparisons' && format('HTTP comparisons ({0})', matrix.runner) || matrix.part == 'client' && format('client checks ({0})', matrix.runner) || matrix.part == 'server' && format('server checks ({0})', matrix.runner) || format('paths ({0})', matrix.runner) }}
    if: inputs.suite == 'http-clients' || inputs.suite == 'http-server-memory' || (inputs.suite == 'server-repeat' || inputs.suite == 'server-arc') || inputs.suite == 'chain-cleanup' || (inputs.suite == 'stream-owners' || (inputs.suite == 'stream-clients' || (inputs.suite == 'stream-repeat' || (inputs.suite == 'connection-repeat' || inputs.suite == 'sender-repeat')))) || inputs.suite == 'stream-storage' || inputs.suite == 'context-owners' || inputs.suite == 'context-storage' || inputs.suite == 'service-values-linux' || inputs.suite == 'service-values' || (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows') || inputs.suite == 'udp' || inputs.suite == 'sockets' || inputs.suite == 'kernels' || inputs.suite == 'byte-decoders' || inputs.suite == 'decoders' || inputs.suite == 'vectors' || inputs.suite == 'paths' || inputs.suite == 'filesystem' || inputs.suite == 'fields' || inputs.suite == 'processes' || inputs.suite == 'mapped-arrays' || inputs.suite == 'zip-maps' || inputs.suite == 'zip-windows' || inputs.suite == 'hash' || inputs.suite == 'hash-windows'
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.suite == 'http-clients' && '["ownership","comparisons"]' || (inputs.suite == 'server-repeat' || inputs.suite == 'server-arc') && '["server","client","calls"]' || '["all"]') }}
        runner: ${{ fromJSON(inputs.native_runner != 'all' && format('["{0}"]', inputs.native_runner) || (inputs.suite == 'stream-storage' || inputs.suite == 'context-storage' || inputs.suite == 'service-values-linux') && '["ubuntu-latest"]' || (inputs.suite == 'zip-windows' || inputs.suite == 'hash-windows' || inputs.suite == 'tcp-windows') && '["windows-2025","windows-11-arm"]' || '["ubuntu-latest","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        id: windows_toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-windows.ps1
      - uses: actions/cache/restore@v6
        id: decoder_tls_cache
        if: runner.os == 'Windows' && (inputs.suite == 'http-clients' || inputs.suite == 'http-server-memory' || inputs.suite == 'byte-decoders' || inputs.suite == 'decoders' || (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows') || inputs.suite == 'service-values' || inputs.suite == 'context-owners' || (inputs.suite == 'stream-owners' || (inputs.suite == 'stream-clients' || (inputs.suite == 'stream-repeat' || (inputs.suite == 'connection-repeat' || (inputs.suite == 'sender-repeat' || (inputs.suite == 'server-repeat' || inputs.suite == 'server-arc')))))))
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: Native Windows TLS dependencies
        if: runner.os == 'Windows' && (inputs.suite == 'http-clients' || inputs.suite == 'http-server-memory' || inputs.suite == 'byte-decoders' || inputs.suite == 'decoders' || (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows') || inputs.suite == 'service-values' || inputs.suite == 'context-owners' || (inputs.suite == 'stream-owners' || (inputs.suite == 'stream-clients' || (inputs.suite == 'stream-repeat' || (inputs.suite == 'connection-repeat' || (inputs.suite == 'sender-repeat' || (inputs.suite == 'server-repeat' || inputs.suite == 'server-arc')))))))
        shell: pwsh
        run: ./scripts/setup-windows-tls.ps1
      - uses: actions/cache/save@v6
        if: runner.os == 'Windows' && (inputs.suite == 'http-clients' || inputs.suite == 'http-server-memory' || inputs.suite == 'byte-decoders' || inputs.suite == 'decoders' || (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows') || inputs.suite == 'service-values' || inputs.suite == 'context-owners' || (inputs.suite == 'stream-owners' || (inputs.suite == 'stream-clients' || (inputs.suite == 'stream-repeat' || (inputs.suite == 'connection-repeat' || (inputs.suite == 'sender-repeat' || (inputs.suite == 'server-repeat' || inputs.suite == 'server-arc'))))))) && env.FWP_WINDOWS_DEPS_READY == '1' && steps.decoder_tls_cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/fwp-windows-deps
          key: windows-tls-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-tls.ps1') }}
      - name: OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.part == 'all' || matrix.part == 'server' || matrix.part == 'ownership'
      - name: HTTP ownership and shared connection controls
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'http-clients' && matrix.part == 'ownership' }}
        shell: bash
        run: |
          cargo test --no-fail-fast --lib --test native_sockets --test http2_client_ownership --test http2_server_ownership --test http2_peer_cleanup --test http2_body_roots --test grpc_connect_startup --test grpc_connect_cleanup --test grpc_connection_addresses --test grpc_tls_pool_identity --test grpc_client_receive --test grpc_client_requests --test library_resources
      - name: Reject cyclic ownership at unsupported boundaries
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'http-clients' && matrix.part == 'ownership' }}
        run: cargo test --test arc_execution arc_rejects_unproved_runtime_boundaries_and_disabled_counting -- --exact --nocapture
      - name: Preserve the counted-owner escape check
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'http-clients' && matrix.part == 'ownership' }}
        run: cargo test --test arc_execution arc_checks_reject_counted_owners_at_uncounted_boundaries -- --exact --nocapture
      - name: Record HTTP platform and ownership metadata
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && (inputs.suite == 'http-clients' || inputs.suite == 'http-server-memory') }}
        env:
          FWP_HTTP_CLIENT_ARTIFACTS: http-client-evidence
        shell: bash
        run: |
          mkdir -p http-client-evidence
          git rev-parse HEAD > http-client-evidence/revision.txt
          rustc -Vv > http-client-evidence/rust.txt
          clang --version > http-client-evidence/c.txt
          python3 - <<'PYENV'
          import os, pathlib, platform, subprocess
          commands = {
              "Linux": ["lscpu"],
              "macOS": ["sysctl", "machdep.cpu", "hw.memsize"],
              "Windows": ["powershell", "-NoProfile", "-Command", "Get-CimInstance Win32_Processor | Format-List Name,Architecture,NumberOfCores,NumberOfLogicalProcessors"],
          }
          pathlib.Path("http-client-evidence/platform.txt").write_text(platform.platform())
          pathlib.Path("http-client-evidence/cpu.txt").write_text(subprocess.check_output(commands[os.environ["RUNNER_OS"]], text=True))
          PYENV
          python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output http-client-evidence/primitive-inventory.json
      - name: Native HTTP client and server comparisons
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'http-clients' && matrix.part == 'comparisons' }}
        env:
          FWP_HTTP_CLIENT_ARTIFACTS: http-client-evidence
        run: cargo test --test web checked_arc_http_matches_interpreter_with_pooled_and_tls_calls -- --exact --nocapture
      - name: Repeated HTTP client memory costs
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'http-clients' && matrix.part == 'comparisons' }}
        env:
          FWP_HTTP_MEMORY_ARTIFACTS: http-client-evidence/memory
        run: cargo test --test web repeated_http_client_memory_measurement -- --ignored --exact --nocapture
      - name: HTTP server managed memory and resident memory
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && inputs.suite == 'http-server-memory' }}
        env:
          FWP_HTTP_SERVER_MEMORY_ARTIFACTS: http-client-evidence/server-memory
        run: cargo test --test web repeated_http_server_memory_measurement -- --ignored --exact --nocapture
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.suite == 'http-clients' || inputs.suite == 'http-server-memory')
        with:
          name: ${{ inputs.suite }}-${{ matrix.runner }}${{ matrix.part == 'ownership' && '-ownership' || '' }}
          path: http-client-evidence/
          if-no-files-found: error
      - name: Measure wrapped-chain cleanup
        if: inputs.suite == 'chain-cleanup'
        env:
          FWP_CHAIN_ARTIFACTS: chain-evidence
        run: cargo test --test arc_execution wrapped_chain_cleanup_stack_measurement -- --exact --nocapture
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'chain-cleanup'
        with:
          name: chain-cleanup-${{ matrix.runner }}
          path: chain-evidence/
          if-no-files-found: error
      - name: Byte decoder cleanup repair
        if: inputs.suite == 'byte-decoders'
        run: cargo test --test byte_decoder_ownership -- --nocapture
      - name: Filesystem ownership
        if: inputs.suite == 'paths' || inputs.suite == 'filesystem'
        run: cargo test --no-fail-fast --test path_validation --test io_error_ownership --test system_snapshots --test file_values --test text_file_tools --test stdlib_doc --test file_construction_ownership --test file_inline_path --test file_storage_disposal
      - name: Retrieve immutable CPU kernel baseline
        if: inputs.suite == 'kernels' || inputs.suite == 'byte-decoders' || inputs.suite == 'decoders'
        run: |
          git fetch --no-tags --depth=1 origin 21a621c699d11a84c05f955935dc95dcfb8adbf2
          git show 21a621c699d11a84c05f955935dc95dcfb8adbf2:runtime/fwp_rt_kernel.c > kernel-baseline.c
      - name: UDP lifetimes and socket cleanup
        if: inputs.suite == 'udp'
        env:
          FWP_UDP_ARTIFACTS: udp-evidence
        run: cargo test --no-fail-fast --lib resource::tests && cargo test --no-fail-fast --test compiler_options --test udp_ownership --test native_sockets --test arc_tasks --test file_values --test file_inline_path
      - uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'udp'
        with:
          name: udp-${{ matrix.runner }}
          path: udp-evidence/
          if-no-files-found: ignore
      - name: Check long-running server resident memory
        if: matrix.part == 'calls' && runner.os == 'Linux'
        run: |
          if [ "${{ inputs.suite }}" = server-arc ]; then
            cargo test --test gc arc_grpc_server_runs_in_bounded_memory -- --exact --nocapture
          else
            cargo test --test gc grpc_server_runs_in_bounded_memory -- --exact --nocapture
          fi
      - name: Prepare server measurements and check compiler ownership
        if: matrix.part == 'calls'
        shell: bash
        run: |
          mkdir -p server-memory-evidence
          git rev-parse HEAD > server-memory-evidence/source.txt
          rustc --version --verbose > server-memory-evidence/rust.txt
          python3 - <<'PYENV'
          import os, pathlib, subprocess
          commands = {
              "Linux": ["lscpu"],
              "macOS": ["sysctl", "machdep.cpu", "hw.memsize"],
              "Windows": ["powershell", "-NoProfile", "-Command", "Get-CimInstance Win32_Processor | Format-List Name,Architecture,NumberOfCores,NumberOfLogicalProcessors"],
          }
          pathlib.Path("server-memory-evidence/c.txt").write_text(subprocess.check_output([os.environ["CC"], "--version"], text=True))
          pathlib.Path("server-memory-evidence/cpu.txt").write_text(subprocess.check_output(commands[os.environ["RUNNER_OS"]], text=True))
          PYENV
          python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output server-memory-evidence/primitive-inventory.json
          cargo test --lib arc_scope::tests
          cargo test --lib rc::tests
          cargo test --test worker_preparation_ownership --test compiler_call_liveness --test worker_boxing_ownership --test wide_workers --test library_input_ownership
      - name: Check callback and server cleanup
        if: matrix.part == 'server'
        shell: bash
        run: |
          cargo test --test fold_ownership --test right_fold_ownership --test fold_unwind_ownership --test borrowed_callbacks
          cargo test --test grpc_server_connections --test grpc_server_requests --test grpc_connect_startup --test grpc_server_ownership
          cargo test --test grpc_client_receive --test grpc_response_encoding --test channel_queue_ownership --test arc_tasks
          cargo test --test list_applicative_ownership inactive_state_slots_are_cleared_at_real_collection_and_handler_boundaries -- --exact
      - name: Check client cleanup
        if: matrix.part == 'client'
        shell: bash
        run: |
          cargo test --test grpc_peer_completion --test grpc_status_cleanup --test grpc_receive_cleanup --test grpc_send_cleanup --test grpc_client_failure_text --test task_ownership --test grpc_request_encoding --test grpc_client_requests
      - name: Check calls between processes
        if: matrix.part == 'calls'
        run: cargo test --test grpc
      - name: Measure memory after repeated server calls
        if: matrix.part == 'calls'
        shell: bash
        env:
          FWP_SERVER_MEMORY_ARTIFACTS: server-memory-evidence
        run: |
          if [ "${{ inputs.suite }}" = server-arc ]; then
            cargo test --test grpc server_measurement::repeated_arc_server_call_memory -- --exact --ignored --nocapture
          else
            cargo test --test grpc server_measurement::repeated_server_call_memory -- --exact --ignored --nocapture
          fi
      - uses: actions/upload-artifact@v7
        if: always() && matrix.part == 'calls'
        with:
          name: server-calls-${{ matrix.runner }}
          path: server-memory-evidence/
          if-no-files-found: error
      - name: Measure complete remote-stream clients
        if: (inputs.suite == 'stream-clients' || (inputs.suite == 'stream-repeat' || (inputs.suite == 'connection-repeat' || inputs.suite == 'sender-repeat')))
        shell: bash
        env:
          FWP_STREAM_CLIENT_ARTIFACTS: stream-client-evidence
          FWP_REPEATED_CLIENT_ARTIFACTS: stream-client-evidence
        run: |
          mkdir -p stream-client-evidence
          git rev-parse HEAD > stream-client-evidence/source.txt
          rustc --version --verbose > stream-client-evidence/rust.txt
          python3 - <<'PYENV'
          import os, pathlib, subprocess
          commands = {
              "Linux": ["lscpu"],
              "macOS": ["sysctl", "machdep.cpu", "hw.memsize"],
              "Windows": ["powershell", "-NoProfile", "-Command", "Get-CimInstance Win32_Processor | Format-List Name,Architecture,NumberOfCores,NumberOfLogicalProcessors"],
          }
          pathlib.Path("stream-client-evidence/c.txt").write_text(subprocess.check_output([os.environ["CC"], "--version"], text=True))
          pathlib.Path("stream-client-evidence/cpu.txt").write_text(subprocess.check_output(commands[os.environ["RUNNER_OS"]], text=True))
          PYENV
          python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output stream-client-evidence/primitive-inventory.json
          cargo test --lib grpc::stream_source_tests::sender_cancelled_before_entry_does_not_force_input -- --exact
          cargo test --test grpc_request_encoding -- --nocapture
          cargo test --no-fail-fast --test task_handle_ownership --test arc_tasks --test grpc_force_cleanup --test grpc_canonical_encoding --test grpc_receive_cleanup --test grpc_status_cleanup --test grpc_send_cleanup --test grpc_client_receive --test grpc_client_requests --test grpc_client_failure_text --test grpc_peer_completion --test grpc_context_resources --test grpc_tls_pool_identity --test grpc_connection_addresses --test grpc_environment_cache -- --nocapture
          if [ "${{ runner.os }}" != "Windows" ]; then
            cargo test --no-fail-fast --test grpc_connect_startup --test grpc_connect_cleanup -- --nocapture
          fi
          cargo test --test grpc server_startup_deadline_covers_silent_processes -- --exact
          if [ "${{ inputs.suite }}" = "stream-repeat" ] || [ "${{ inputs.suite }}" = "connection-repeat" ] || [ "${{ inputs.suite }}" = "sender-repeat" ]; then
            cargo test --test grpc every_kind_of_call -- --exact
            cargo test --test grpc stream_aliases_are_consistent_across_tasks -- --exact
            cargo test --test grpc calls_are_concurrent -- --exact
            if [ "${{ inputs.suite }}" = "sender-repeat" ]; then
              cargo test --test grpc sender_input_memory_measurement -- --exact --ignored --nocapture
            elif [ "${{ inputs.suite }}" = "connection-repeat" ]; then
              cargo test --test grpc closed_remote_connection_memory_measurement -- --exact --ignored --nocapture
            else
              cargo test --test grpc repeated_remote_call_memory_measurement -- --exact --ignored --nocapture
            fi
          else
            cargo test --test grpc remote_stream_client_memory_measurement -- --exact --ignored --nocapture
          fi
      - name: Unique closure capture ownership
        if: (inputs.suite == 'stream-clients' || (inputs.suite == 'stream-repeat' || (inputs.suite == 'connection-repeat' || inputs.suite == 'sender-repeat')))
        env:
          FWP_STREAM_CLIENT_ARTIFACTS: stream-client-evidence
          FWP_REPEATED_CLIENT_ARTIFACTS: stream-client-evidence
        run: cargo test --no-fail-fast --test boxed_projection_ownership --test argument_preparation_ownership --test closure_ownership --test retain_unwind_ownership --test runtime_call_ownership --test constructor_type_ownership --test scope_thunk_ownership --test retained_thunk_ownership
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.suite == 'stream-clients' || (inputs.suite == 'stream-repeat' || (inputs.suite == 'connection-repeat' || inputs.suite == 'sender-repeat')))
        with:
          name: ${{ inputs.suite == 'sender-repeat' && 'sender-clients' || inputs.suite == 'connection-repeat' && 'closed-clients' || inputs.suite == 'stream-repeat' && 'repeated-clients' || 'stream-clients' }}-${{ matrix.runner }}
          path: stream-client-evidence/
          if-no-files-found: error
      - name: Measure queued remote-stream cache storage
        if: inputs.suite == 'stream-storage' || inputs.suite == 'stream-owners'
        shell: bash
        env:
          FWP_STREAM_ARTIFACTS: stream-evidence
        run: |
          mkdir -p stream-evidence
          git rev-parse HEAD > stream-evidence/source.txt
          rustc --version --verbose > stream-evidence/rust.txt
          python3 - <<'PYENV'
          import os, pathlib, subprocess
          commands = {
              "Linux": ["lscpu"],
              "macOS": ["sysctl", "machdep.cpu", "hw.memsize"],
              "Windows": ["powershell", "-NoProfile", "-Command", "Get-CimInstance Win32_Processor | Format-List Name,Architecture,NumberOfCores,NumberOfLogicalProcessors"],
          }
          compiler = subprocess.check_output([os.environ["CC"], "--version"], text=True)
          pathlib.Path("stream-evidence/c.txt").write_text(compiler)
          details = subprocess.check_output(commands[os.environ["RUNNER_OS"]], text=True)
          pathlib.Path("stream-evidence/cpu.txt").write_text(details)
          PYENV
          cargo test --lib grpc::stream_source_tests
          cargo test --no-fail-fast --test grpc_force_cleanup --test grpc_render_cleanup --test grpc_receive_cleanup --test grpc_status_cleanup --test grpc_send_cleanup --test grpc_request_encoding --test grpc_response_encoding --test grpc_client_receive --test grpc_client_requests --test grpc_client_failure_text --test grpc_server_ownership -- --nocapture
          cargo test --test grpc every_kind_of_call -- --exact
          cargo test --test grpc stream_aliases_are_consistent_across_tasks -- --exact
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.suite == 'stream-storage' || inputs.suite == 'stream-owners')
        with:
          name: stream-storage-${{ matrix.runner }}
          path: stream-evidence/
          if-no-files-found: error
      - name: Service scope ownership contract inventory
        if: inputs.suite == 'context-storage' || inputs.suite == 'context-owners'
        run: python3 scripts/check-primitive-inventory.py --baseline tests/fixtures/primitive-inventory-baseline.json --output context-evidence/contracts.json
      - name: Functional allocation and ownership
        if: inputs.suite == 'context-storage' || inputs.suite == 'context-owners'
        env:
          FWP_CONTEXT_ARTIFACTS: context-evidence
        run: cargo test --no-fail-fast --test unboxed_worker_locals --test state_sequence_ownership --test fold_unwind_ownership --test native_allocator -- --nocapture
      - name: Repeated service context storage
        if: inputs.suite == 'context-storage' || inputs.suite == 'context-owners'
        env:
          FWP_CONTEXT_ARTIFACTS: context-evidence
        run: cargo test --no-fail-fast --test record_conversion_ownership --test process_exit_ownership --test grpc_canonical_encoding --test grpc_response_encoding --test service_scope_ownership --test service_context_storage --test grpc_context_restore --test grpc_context_resources --test grpc_capture_resources --test grpc_packed_options --test grpc_environment_cache --test grpc_peer_completion --test http2_peer_cleanup --test library_unload --test arc_tasks --test stdlib_doc -- --nocapture
      - name: Compare old and current list iteration timing
        if: runner.os == 'Linux' && (inputs.suite == 'context-storage' || inputs.suite == 'context-owners')
        run: python3 scripts/measure-list-each.py --compiler target/debug/fwp --output context-evidence/iteration-timing
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.suite == 'context-storage' || inputs.suite == 'context-owners')
        with:
          name: context-storage-${{ matrix.runner }}
          path: context-evidence/
          if-no-files-found: error
      - name: Service scopes through actual interpreted and native calls
        if: inputs.suite == 'context-storage' || inputs.suite == 'context-owners'
        run: cargo test --test grpc every_kind_of_call -- --exact
      - name: Copied service result ownership
        if: inputs.suite == 'service-values' || inputs.suite == 'service-values-linux'
        env:
          FWP_REQUIRE_TLS: '1'
          FWP_SERVICE_ARTIFACTS: service-evidence
        run: cargo test --no-fail-fast --test service_value_ownership --test grpc_peer_completion --test http2_peer_cleanup --test grpc_capture_resources --test stdlib_doc
      - name: HTTP/2 body interpreter and native agreement
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && (inputs.suite == 'service-values' || inputs.suite == 'service-values-linux') }}
        run: cargo test --lib grpc::web::tests::body_bounds_and_error_order_agree_with_native -- --exact
      - name: HTTP/2 body source lifetime
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && (inputs.suite == 'service-values' || inputs.suite == 'service-values-linux') && runner.os != 'Windows' }}
        run: cargo test --test http2_body_roots
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.suite == 'service-values' || inputs.suite == 'service-values-linux')
        with:
          name: service-values-${{ matrix.runner }}
          path: service-evidence/
          if-no-files-found: error
      - name: TCP and TLS value ownership
        if: (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows')
        env:
          FWP_REQUIRE_TLS: '1'
          FWP_TCP_CONSTRUCTOR_ARTIFACTS: tcp-evidence
          FWP_UDP_ARTIFACTS: tcp-evidence/udp
        run: |
          cargo test --no-fail-fast --lib resource::tests
          cargo test --no-fail-fast --test native_sockets --test udp_ownership --test arc_tasks
      - name: TLS stream interpreter and native agreement
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows') }}
        env:
          FWP_REQUIRE_TLS: '1'
        run: cargo test --test tls streams -- --exact
      - name: Mutual TLS with checked ARC
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows') }}
        env:
          FWP_REQUIRE_TLS: '1'
          FWP_TCP_CONSTRUCTOR_ARTIFACTS: tcp-evidence
        run: cargo test --test tls mutual_tls -- --exact
      - name: Native TLS socket errors and clean shutdown
        if: ${{ !cancelled() && (runner.os != 'Windows' || steps.windows_toolchain.outcome == 'success') && (inputs.suite == 'tcp' || inputs.suite == 'tcp-windows') }}
        env:
