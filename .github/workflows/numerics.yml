name: Service fixture GCC diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download the failing head compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40395391896 --repo e6qu/fun-with-pipes -n fwp-Linux-X64 -D ci-compiler
          tar -xzf ci-compiler/*.tar.gz -C ci-compiler
      - name: Execute the actual Rust service test with GCC
        run: |
          compiler=$(find "$PWD/ci-compiler" -type f -name fwp)
          python3 scripts/diagnose-service-values.py "$compiler" gcc "$RUNNER_TEMP/service-actual"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: service-diagnostic
          path: ${{ runner.temp }}/service-actual/
