name: Buffer ownership baselines

on:
  workflow_dispatch:
    inputs:
      session:
        description: Predeclared independent session (never repeat a numerical failure)
        required: true
        type: choice
        options: ['1', '2']

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            machine: x86_64
            cpu: AMD EPYC 7763 64-Core Processor
            c_version: gcc (Ubuntu 15.2.0-16ubuntu1) 15.2.0
            c_arch: x86-64
            rust_cpu: x86-64
          - runner: ubuntu-24.04-arm
            machine: aarch64
            cpu: Neoverse-N2
            c_version: gcc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0
            c_arch: armv8-a
            rust_cpu: generic
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CC: gcc
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
      SESSION: ${{ inputs.session }}
      MACHINE: ${{ matrix.machine }}
      CPU: ${{ matrix.cpu }}
      C_VERSION: ${{ matrix.c_version }}
      C_ARCH: ${{ matrix.c_arch }}
      RUST_CPU: ${{ matrix.rust_cpu }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Qualify the native host before building or measuring
        run: >-
          python3 scripts/descent-baselines.py --cpu "$CPU" --machine "$MACHINE"
          --cc gcc --rustc rustc --c-version "$C_VERSION"
          --rust-version 'rustc 1.99.1 (58cf8f9c3 2026-10-13)'
          --processors 4 --source "$GITHUB_SHA" --output buffer-baseline/qualification.json
      - name: Build the current production compiler
        run: |
          set -o pipefail
          cargo build --locked --release --bin fwp 2>&1 | tee buffer-baseline/build.log
      - name: Verify interpreter and native results
        run: >-
          python3 scripts/check-unique-buffer-native.py --compiler target/release/fwp --cc gcc
          --output buffer-baseline/native --case -9223372036854775808 --case -1 --case 0
          --case 1 --case 16 --case 4096 --case 262144 --timeout 45
      - name: Prepare ordinary programs and compiler reports
        run: >-
          python3 scripts/prepare-buffer-baselines.py --native-checks buffer-baseline/native
          --output buffer-baseline/programs --cc gcc --rustc rustc
          --c-arch "$C_ARCH" --rust-cpu "$RUST_CPU" --size size --objcopy objcopy
      - name: Verify complete evidence and deliberate damage controls
        run: |
          python3 scripts/test-buffer-processes.py
          python3 scripts/test-unique-buffer-baselines.py
          python3 scripts/check-buffer-pipeline.py --programs buffer-baseline/programs --output buffer-baseline/synthetic-control
      - name: Collect the fixed ordinary-program session
        run: >-
          python3 scripts/measure-buffer-baselines.py --programs buffer-baseline/programs
          --qualification buffer-baseline/qualification.json --output buffer-baseline/observed
          --time /usr/bin/time --session "$SESSION" --cpu-policy all --timeout 45
      - name: Independently reconstruct retained results
        if: ${{ !cancelled() && hashFiles('buffer-baseline/observed/manifest.json') != '' }}
        run: >-
          python3 scripts/check-buffer-baselines.py --input buffer-baseline/observed
          --source "$GITHUB_SHA" --machine "$MACHINE" --session "$SESSION" --origin observed
      - name: Retain complete or partial evidence
        if: ${{ always() && hashFiles('buffer-baseline/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: buffer-baseline-${{ matrix.machine }}-${{ inputs.session }}
          path: buffer-baseline/
          if-no-files-found: error
