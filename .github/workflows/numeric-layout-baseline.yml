name: Current numeric array bytes and ABI baseline
on:
  push:
    branches: [ownership-evidence-numeric-layout-baseline]
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FWP_NUMERIC_LAYOUT_ARTIFACTS: ${{ runner.temp }}/numeric-layout-baseline
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Current bytes, original semantics and diagnostic ABI
        run: python3 scripts/measure-numeric-layout-baseline.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numeric-layout-metadata-${{ matrix.runner }}
          path: ${{ runner.temp }}/numeric-layout-baseline/*.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numeric-layout-controls-${{ matrix.runner }}
          path: ${{ runner.temp }}/numeric-layout-baseline/
