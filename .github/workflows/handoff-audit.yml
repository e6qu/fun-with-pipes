name: Streamlined roadmap handoff audit

on:
  push:
    branches: [roadmap/handoff-pr123-20261011]

permissions:
  contents: read

jobs:
  handoff_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain review heads for immutable preparation references
        run: git fetch origin "+refs/pull/*/head:refs/remotes/origin/review/*"
      - name: Check links, preparation ancestry and commit messages
        run: python3 scripts/check-roadmap.py
      - name: Check recovery Python syntax without executing merge drafts
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for source in sorted(Path('scripts/roadmap-recovery').glob('*.py')):
              ast.parse(source.read_text(), filename=str(source))
              print(source)
          PY
