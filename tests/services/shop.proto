// Generated by `fwp proto` from main.fwp.
// fwp services: gRPC over HTTP/2; see docs/services.md for the mapping.

syntax = "proto3";

package fwp;

service Inventory {
  rpc Item(ItemRequest) returns (ItemResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
}

service Pricing {
  rpc UnitPrice(UnitPriceRequest) returns (UnitPriceResponse);
  rpc QuoteOrder(QuoteOrderRequest) returns (QuoteOrderResponse);
  rpc AveragePrice(AveragePriceRequest) returns (AveragePriceResponse);
}

message ItemRequest {
  string arg1 = 1;
}

message InventoryItem {
  string sku = 1;
  string name = 2;
  sint64 stock = 3;
}

message ItemResponse {
  optional InventoryItem value = 1;
}

message ReserveRequest {
  sint64 arg1 = 1;
  string arg2 = 2;
}

message InventoryShortage {
  string sku = 1;
  sint64 wanted = 2;
  sint64 available = 3;
}

message ReserveResponse {
  oneof result {
    sint64 value = 1;
    InventoryShortage error = 2;
  }
}

message UnitPriceRequest {
  string arg1 = 1;
}

message UnitPriceResponse {
  sint64 value = 1;
}

message TupleStringI64 {
  string f0 = 1;
  sint64 f1 = 2;
}

message QuoteOrderRequest {
  bool arg1 = 1;
  repeated TupleStringI64 arg2 = 2;
}

message PricingQuote {
  repeated PricingLine lines = 1;
  sint64 subtotal = 2;
  PricingDiscount discount = 3;
  sint64 total = 4;
}

message PricingDiscount {
  message NoDiscount {}
  message Percent {
    sint64 f0 = 1;
  }
  oneof value {
    NoDiscount no_discount = 1;
    Percent percent = 2;
  }
}

message PricingLine {
  string sku = 1;
  sint64 quantity = 2;
  sint64 cents = 3;
}

message QuoteOrderResponse {
  oneof result {
    PricingQuote value = 1;
    InventoryShortage error = 2;
  }
}

message AveragePriceRequest {
  repeated string arg1 = 1;
}

message AveragePriceResponse {
  double value = 1;
}
