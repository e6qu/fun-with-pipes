name: Device output allocation limits and kernel validation
on:
  push:
    branches: [ownership-evidence-device-output-bounds]
permissions:
  contents: read
jobs:
  kernels:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Verify stack guards and original numeric semantics
        env:
          FWP_DEVICE_BOUNDS_ARTIFACTS: ${{ runner.temp }}/device-bounds-evidence
        run: |
          mkdir -p "$FWP_DEVICE_BOUNDS_ARTIFACTS"
          uname -a > "$FWP_DEVICE_BOUNDS_ARTIFACTS/hardware.txt"
          clang --version > "$FWP_DEVICE_BOUNDS_ARTIFACTS/compiler.txt"
          rustfmt --edition 2021 src/numerics.rs tests/device_bounds.rs tests/kernel_stack_bounds.rs tests/numerics.rs
          cargo clippy --test device_bounds --test kernel_stack_bounds --test numerics -- -D warnings
          cargo test --test device_bounds --test kernel_stack_bounds --test numerics --no-fail-fast -- --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-bounds-${{ matrix.runner }}
          path: ${{ runner.temp }}/device-bounds-evidence/
