name: Function argument effect weakening regression
on:
  push:
    branches: [ownership-evidence-function-argument-effects]
permissions:
  contents: read
jobs:
  codecs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Format and verify focused contracts
        env:
          FWP_TYPED_STATE_ARTIFACTS: ${{ runner.temp }}/effects
        run: |
          rustfmt --edition 2021 src/infer.rs tests/call_effects.rs
          cargo test --lib
          cargo test --test call_effects --test task_ownership --test golden_check --test typed_state_ownership --no-fail-fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: function-argument-effects
          path: ${{ runner.temp }}/effects
