name: Prepare resource network ownership bundle
on:
  push:
    branches: [ownership-roadmap-preparation]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain preparation branches and immutable tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - name: Ordinary commit metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Preserve prepared source and original controls
        run: python3 scripts/prepare-resource-network.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-network-preparation
          path: |
            preparation.json
            rebase.log
            prepared-commits.json.gz
