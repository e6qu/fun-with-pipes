name: Direct scoped gradient allocation and ownership controls
on:
  push:
    branches: [ownership-evidence-ad-scope-direct]
permissions:
  contents: read
jobs:
  allocations:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Record hardware, source identity and native compiler arguments
        run: |
          export FWP_TYPED_STATE_ARTIFACTS="$RUNNER_TEMP/typed-state-allocation"
          echo "FWP_TYPED_STATE_ARTIFACTS=$FWP_TYPED_STATE_ARTIFACTS" >> "$GITHUB_ENV"
          mkdir -p "$FWP_TYPED_STATE_ARTIFACTS"
          git rev-parse HEAD > "$FWP_TYPED_STATE_ARTIFACTS/driver.txt"
          uname -a > "$FWP_TYPED_STATE_ARTIFACTS/hardware.txt"
          clang --version > "$FWP_TYPED_STATE_ARTIFACTS/compiler.txt"
          rustc --version > "$FWP_TYPED_STATE_ARTIFACTS/rustc.txt"
          cat > "$FWP_TYPED_STATE_ARTIFACTS/record-cc" <<'SH'
          #!/bin/sh
          printf 'clang argument vector\n' >> "$FWP_TYPED_STATE_ARTIFACTS/compiler-invocations.txt"
          printf '%s\n' "$@" >> "$FWP_TYPED_STATE_ARTIFACTS/compiler-invocations.txt"
          exec clang "$@"
          SH
          chmod +x "$FWP_TYPED_STATE_ARTIFACTS/record-cc"
          echo "CC=$FWP_TYPED_STATE_ARTIFACTS/record-cc" >> "$GITHUB_ENV"
      - name: Format and preserve exact tested sources
        run: |
          rustfmt --edition 2021 src/interp.rs src/ownership.rs src/cgen.rs tests/ad_tape_scopes.rs
          cargo build --bin fwp
          target/debug/fwp fmt lib/autodiff.fwp
          target/debug/fwp fmt --check lib/autodiff.fwp
          mkdir -p "$FWP_TYPED_STATE_ARTIFACTS/sources/src" "$FWP_TYPED_STATE_ARTIFACTS/sources/runtime" "$FWP_TYPED_STATE_ARTIFACTS/sources/lib" "$FWP_TYPED_STATE_ARTIFACTS/sources/tests/fixtures"
          cp src/interp.rs src/ownership.rs src/cgen.rs "$FWP_TYPED_STATE_ARTIFACTS/sources/src/"
          cp runtime/fwp_rt_kernel.c "$FWP_TYPED_STATE_ARTIFACTS/sources/runtime/"
          cp lib/autodiff.fwp "$FWP_TYPED_STATE_ARTIFACTS/sources/lib/"
          cp tests/ad_tape_scopes.rs "$FWP_TYPED_STATE_ARTIFACTS/sources/tests/"
          cp tests/fixtures/ad_scope_probe.c "$FWP_TYPED_STATE_ARTIFACTS/sources/tests/fixtures/"
          git diff > "$FWP_TYPED_STATE_ARTIFACTS/tested-source.patch"
      - name: Preserve scope cleanup, gradients, effect snapshots and formatting
        env:
          FWP_AD_SCOPE_ARTIFACTS: ${{ runner.temp }}/typed-state-allocation/scopes
        run: |
          cargo test --lib
          cargo test --test ad_tape_ownership --test ad_tape_scopes --test golden_check --test call_effects --test fmt --test stdlib_doc --no-fail-fast
      - name: Equivalent gradients with complete managed counters
        if: ${{ !cancelled() }}
        env:
          FWP_AD_ALLOCATION_ARTIFACTS: ${{ runner.temp }}/typed-state-allocation/allocations
        run: |
          export FWP_SCOPE_CANDIDATE="$(git rev-parse HEAD)"
          python3 scripts/measure-ad-scope-allocations-complete.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-scoped-gradients-${{ matrix.runner }}
          path: ${{ runner.temp }}/typed-state-allocation/
