name: Finalize accepted resource network bundle

on:
  push:
    branches: [ownership-roadmap-finalization]

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: e6qu/fun-with-pipes
      # Replace these frozen evidence bindings if a focused repair is needed.
      # Publish this driver only after PR123, preparation and GC evidence pass.
      # Set only after the verified export is published and its exact head checked.
      FWP_PREPARATION_HEAD: REPLACE_WITH_VERIFIED_PUBLICATION_HEAD
      FWP_RECOVERY_HEAD: 6d51eca63c7d907c47c05f92d2d9b90229dfc821
      FWP_SCOPE_EVIDENCE_HEAD: 475cb242715961e5e396e4fe74026545160d2e3c
      FWP_SCOPE_EVIDENCE_RUN: "38141558055"
      FWP_ALLOCATION_EVIDENCE_HEAD: e586a4d12a477aefcc854e12f6bbf2f640299de8
      FWP_ALLOCATION_EVIDENCE_RUN: "38145198463"
      FWP_LIST_AP_EVIDENCE_HEAD: 05556bfb3d7f7e2299cdfcad84d220d5455f75f2
      FWP_LIST_AP_EVIDENCE_RUN: "38148442793"
      FWP_GC_EVIDENCE_HEAD: a44c3da1aa344266262fc99471b331b053db371b
      FWP_AD_EVIDENCE_HEAD: 602e076604d3dd759c47b396c10cf848dd9dbb61
      FWP_AD_EVIDENCE_RUN: "38139112950"
      FWP_GC_EVIDENCE_RUN: "38136959809"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Retain actual main, evidence and immutable preparation tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - name: Ordinary commit metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify prerequisites and finalize preparation
        run: python3 scripts/finalize-resource-network.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-network-finalization
          path: finalization-evidence/
