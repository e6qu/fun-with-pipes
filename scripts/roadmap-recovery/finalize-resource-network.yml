name: Finalize accepted resource network bundle

on:
  push:
    branches: [ownership-roadmap-finalization]

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: e6qu/fun-with-pipes
      # Replace these frozen evidence bindings if a focused repair is needed.
      # Publish this driver only after PR123, preparation and GC evidence pass.
      # Set only after the verified export is published and its exact head checked.
      FWP_PREPARATION_HEAD: 066b497040ff7b7f59fec6ff3337c63428f83d77
      FWP_RECOVERY_HEAD: 1992c95d376c343b00a6ca662ac5f9b5f1c28888
      FWP_SCOPE_EVIDENCE_HEAD: fbc7e38087b3708c60d21302e29b9013c7d6fa2c
      FWP_SCOPE_EVIDENCE_RUN: "38159488927"
      FWP_ALLOCATION_EVIDENCE_HEAD: 9ae50851389fbfa7c5c155fca477a4b958589c99
      FWP_ALLOCATION_EVIDENCE_RUN: "38159536008"
      FWP_LIST_AP_EVIDENCE_HEAD: 4f21a9ea99c1a06a3f1ba67818936194fe43e42a
      FWP_LIST_AP_EVIDENCE_RUN: "38160607296"
      FWP_GC_EVIDENCE_HEAD: a27f8e5f78ab12e397119b76049aa6eefbf88157
      FWP_AD_EVIDENCE_HEAD: 602e076604d3dd759c47b396c10cf848dd9dbb61
      FWP_AD_EVIDENCE_RUN: "38139112950"
      FWP_GC_EVIDENCE_RUN: "38151169253"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Retain actual main, evidence and immutable preparation tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - name: Ordinary commit metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify prerequisites and finalize preparation
        run: python3 scripts/finalize-resource-network.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-network-finalization
          path: finalization-evidence/
