name: Tracing-free ownership preparation
on:
  push:
    branches: [ownership-evidence-tracing-free]
jobs:
  arc:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CC: clang
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      FWP_ARC_ARTIFACTS: arc-evidence
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "FWP_OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Format and check compiler
        run: |
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Eligibility and actual native ownership
        run: cargo test --test arc_execution -- --nocapture
      - name: Existing closure and exceptional ownership
        run: cargo test --no-fail-fast --test closure_ownership --test closure_cleanup --test unwind_cleanup --test ad_tape_ownership --test ad_tape_scopes
      - name: Preserve formatted implementation
        if: always()
        run: |
          mkdir -p arc-evidence/source
          cp src/rc.rs src/arc.rs src/cgen.rs src/main.rs src/lib.rs tests/arc_execution.rs runtime/fwp_rt_gc.c arc-evidence/source/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arc-evidence-${{ matrix.runner }}
          path: arc-evidence/
